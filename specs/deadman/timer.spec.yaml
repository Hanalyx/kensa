spec:
    id: deadman-timer
    version: 0.3.0
    status: draft
    tier: 1

    context:
        system: kensa
        feature: deadman-timer
        description: |
            The deadman timer is the architectural answer to the hardest
            problem in the agentless SSH design: what happens when the
            connection Kensa is using is the thing Kensa is changing? The
            timer uploads a rollback script to the target host and
            schedules it via `at` or `systemd-run`; if the control channel
            survives apply+validate, the timer is cancelled, otherwise the
            scheduled script fires out-of-band and restores pre-state.
            Without this subsystem, the atomicity commitment in
            TRANSACTION_CONTRACT_V1.md §2.2 is not honorable for changes
            that affect SSH, networking, firewall, or PAM.
        related_specs:
            - engine-transaction
            - handler-interface

    objective:
        summary: |
            Provide out-of-band rollback for control-channel-affecting
            transactions. Arm a scheduled rollback script before apply,
            cancel on success, allow to fire on failure.
        scope:
            includes:
                - Pre-flight detection of scheduler availability (at or systemd-run)
                - Rollback script generation from captured PreStates (POSIX sh)
                - Script upload to /tmp/kensa-rollback-<txn-id>.sh
                - Schedule via at or systemd-run with configurable window
                - Cancel path via atrm / systemctl stop transient unit
                - Post-cancel verification of script removal
                - Keep-alive extension for long-running applies
            excludes:
                - Handlers and their capture/apply/rollback logic (delegated)
                - In-band rollback (handled by the engine directly)
                - Pre-state capture (handler responsibility)

    constraints:
        - id: C-01
          description: |
              The scheduler subsystem MUST detect availability of at OR
              systemd-run BEFORE apply runs. If neither is available, the
              engine MUST refuse to execute control-channel-sensitive
              rules and return ErrSchedulerUnavailable.
          type: security
          enforcement: error
        - id: C-02
          description: |
              The rollback script MUST be self-contained POSIX shell. It
              MUST NOT depend on bash-specific syntax, Python, or any
              runtime beyond what the minimal at/systemd-run environment
              provides.
          type: technical
          enforcement: error
        - id: C-03
          description: |
              The scheduled timer window MUST be at least 120 seconds by
              default. Shorter windows risk firing during normal apply;
              longer windows risk leaving the system broken for longer
              if apply hangs.
          type: security
          enforcement: error
        - id: C-04
          description: |
              On successful validate, the engine MUST cancel the timer
              AND verify cancellation by checking that the scheduled
              job no longer appears in atq / systemctl list-timers.
              Silent cancel failure is not acceptable.
          type: security
          enforcement: error
        - id: C-05
          description: |
              The rollback script MUST self-delete after execution (rm -f
              "$0") OR after successful cancel (engine removes the script
              file). Residual /tmp/kensa-rollback-*.sh files are a
              hygiene failure, not atomicity failure, but are still
              reported to the operator.
          type: technical
          enforcement: error
        - id: C-07
          description: |
              The scheduler MUST emit a time spec the chosen scheduler can
              actually parse, and MUST prefer systemd-run over at(1).

              at(1) has no sub-minute unit. `at now + 120 seconds` is a parse
              error on every implementation ("syntax error. Last token seen:
              s", "Garbled time", exit 1), not a distro quirk. Kensa emitted
              exactly that from its first release, so on any host where at was
              installed the deadman could not be armed and every
              control-channel-sensitive remediation aborted before apply in
              DIRECT-SSH mode. The failure is fail-safe (the host is untouched)
              but it makes those remediations unusable on such hosts. It went
              unnoticed because agent mode routes arming through an RPC that
              never reaches this code, and because at is absent from a default
              minimal install, so the broken path was reached only by
              direct-SSH callers on hosts carrying at.

              at(1) ALSO truncates its base time to the whole minute before
              adding the offset, so `now + N minutes` delivers ((N-1)*60,
              N*60], always shorter than N minutes. Measured on RHEL 9: a
              2-minute spec submitted at :03, :10 and :17 past the minute
              scheduled 117, 110 and 103 seconds out.

              A naive ceil(window/60) therefore reads as rounding up and
              behaves as rounding down: the 120-second default became a
              2-minute spec delivering 61 to 120 seconds, so the deadman could
              fire mid-apply and revert a transaction still legitimately in
              flight. That is a worse failure than firing late, and the one the
              rounding was meant to prevent.

              The at path MUST emit ceil((window+60)/60) minutes, the smallest
              count whose lower bound (N-1)*60 is at least the requested
              window. The cost is up to two extra minutes of exposure for an
              uncommitted change: bounded, recoverable, and the right direction
              to err. systemd-run takes seconds natively and is preferred for
              that reason.

              This does not relax C-03: the delivered window is always at least
              the requested one, so the 120-second default stays at least 120
              seconds on both paths.

              Fixtures for either path MUST model the real scheduler's
              argument parsing. The fake that guarded this returned a job line
              for ANY time spec, so it agreed with the code and the spec while
              all three disagreed with every real host.
          type: security
          enforcement: error

        # Constraint C-06 (keep-alive Extend()) deferred alongside
        # AC-07 — see "Deferred ACs" block below. Will be
        # re-introduced when the keep-alive feature lands.

        - id: C-08
          description: |
              An arm MUST NOT report success when the generated rollback
              script contains no steps and the transaction captured
              restorable state.

              The script is built by dry-running each handler's Rollback
              against the captured pre-state. A Rollback that is inert for
              those values contributes nothing, and the engine then records a
              transaction as protected by a timer that fires and restores
              nothing. Arming precedes apply, so refusing aborts with the host
              untouched, which is the posture the deadman exists to provide;
              proceeding under an empty script mutates the host with no
              protection at all.

              This is not hypothetical. A live run produced a script ending at
              `trap cleanup EXIT` with zero steps for the service mechanisms,
              which are among the ones that trigger arming.

              A transaction with no capturable steps is the separate,
              legitimate case: command_exec is control-channel-sensitive and
              non-capturable, so an empty script is correct there and the
              guard MUST NOT fire.

              More generally, a scheduler that is installed but cannot fire
              (at present with atd inactive) MUST be treated as a refusal
              rather than a successful arm, for the same reason.
          type: security
          enforcement: error

    acceptance_criteria:
        - id: AC-01
          description: |
              Pre-flight detection probes for at and systemd-run. At
              least one is available, the engine proceeds. Neither
              available, the engine returns ErrSchedulerUnavailable.
          references_constraints: [C-01]
          priority: critical
        - id: AC-02
          description: |
              Script generation produces POSIX shell that reverses every
              capturable step in the current transaction, in reverse
              order, using captured PreStates.
          references_constraints: [C-02]
          priority: critical
        - id: AC-03
          description: |
              Script is uploaded to /tmp/kensa-rollback-<txn-id>.sh with
              mode 0700. Upload failure (disk full, permissions) aborts
              the transaction before apply.
          references_constraints: [C-02]
          priority: critical
        - id: AC-04
          description: |
              Scheduled via `systemd-run --on-active=<window-seconds>` where
              systemd-run works, else `at now + <ceil((window+60)/60)>
              minutes` (see C-07 for why the +60 is load-bearing). Selection
              is by refusal, not presence, so which scheduler is used is
              decided by AC-11 rather than by this AC. Post-schedule
              verification confirms the job appears in atq or systemctl
              list-timers.

              An earlier revision of this AC specified `at now + 120 seconds`,
              which at(1) cannot parse, and a later one specified
              ceil(window/60), which C-07 in this same file condemns. Both are
              recorded because a spec that quietly acquires the wrong formula
              twice is evidence about the process, not just the code.

              This AC previously read `at now + 120 seconds`, which at(1)
              cannot parse. The spec, the implementation and the test fixture
              all agreed on a syntax no real host accepts, which is how the
              defect shipped.
          references_constraints: [C-03, C-07]
          priority: critical
        - id: AC-05
          description: |
              On successful validate, cancel removes the scheduled job
              and verifies removal. If verification shows the job still
              present, transaction is recorded as errored with an
              anomaly flag.
          references_constraints: [C-04]
          priority: critical
        - id: AC-08
          description: |
              Script cleanup removes /tmp/kensa-rollback-<txn-id>.sh on
              successful cancel. Residual files are detected by a
              post-cancel scan and reported to the operator without
              failing the transaction.
          references_constraints: [C-05]
          priority: medium
        - id: AC-09
          description: |
              CancelDeadman API (from api/deadman.go) executes an
              in-band rollback cleanly and cancels the scheduled
              script. Returns ErrNoActiveDeadman if no timer is armed.
          references_constraints: [C-04]
          priority: high

        - id: AC-11
          description: |
              Scheduler selection prefers systemd-run when both are present,
              uses at(1) when only at is present, and FALLS THROUGH to the next
              available scheduler when the preferred one refuses the job rather
              than only when it is absent. Arm fails only when every available
              scheduler refuses, and the error names each attempt.

              Presence is not usability: systemd-run is installed on every
              fleet host but answers "Failed to start transient timer unit:
              Interactive authentication required" without privilege, while
              at(1) on the same host schedules fine. Committing to a scheduler
              at probe time aborts the transaction with a working scheduler
              sitting idle.

              Locked by TestSchedulerPrefersSystemdRunWhenBothPresent,
              TestSchedulerFallsThroughWhenSystemdRunRefuses,
              TestArmFailsWhenEverySchedulerRefuses and
              TestAtRemainsTheFallback.
          references_constraints: [C-07]
          priority: critical
        - id: AC-12
          description: |
              The at(1) path emits whole minutes and never a spec that could
              fire before the requested window: for every window the emitted
              count N satisfies (N-1)*60 >= window, so the 120-second default
              emits 3 minutes, not 2. The command contains no "seconds" unit,
              which at(1) cannot parse at all.

              The assertion is on the delivered lower bound rather than a
              literal command string, because the lower bound is the safety
              property. Locked by TestAtSchedulingNeverFiresEarly, with
              TestAtSchedulingUsesWholeMinutes anchoring the encoding, both
              against a fake that rejects the time specs at(1) rejects.
          references_constraints: [C-07]
          priority: critical

        - id: AC-13
          description: |
              Arm refuses, with ErrEmptyRollbackScript and without scheduling
              anything, when the rollback script has no steps and any captured
              step is capturable. It still arms when no step is capturable
              (command_exec). A queued at job is removed when the arm is
              refused because atd is not running, and a systemd-run unit that
              was created before its verification failed is stopped before the
              next scheduler is tried, so a failed candidate leaves nothing
              behind for a Cancel that will never reference it.

              Locked by TestArmRefusesAnEmptyRollbackScript,
              TestArmAllowsAnEmptyScriptForNonCapturableOnly,
              TestAtArmRefusedWhenAtdIsNotRunning and
              TestFailedSystemdRunScheduleLeavesNoTimer.
          references_constraints: [C-08]
          priority: critical

    # Deferred ACs — moved out of strict-coverage scope; track in
    # backlog for future deliverables. The spec keeps the AC IDs
    # reserved so re-introduction (when implemented) preserves the
    # historical AC numbering.
    #
    #   - AC-06 (connection-loss-mid-apply integration test):
    #     Requires emulated SSH disconnect. Out of scope for unit
    #     tests; covered structurally by AC-02 script-content
    #     tests. Future deliverable: cmd/kensa-fuzz extension to
    #     simulate mid-apply SSH drop on a real host.
    #   - AC-07 (keep-alive Extend()):
    #     Feature not yet implemented in deadman.Armer. Tracked in
    #     SPECTER_FEATURE_REQUEST.md.
    #   - AC-10 (clock-skew detection):
    #     Feature not yet implemented in deadman.Armer. Tracked in
    #     SPECTER_FEATURE_REQUEST.md.

    depends_on:
        - spec_id: handler-interface
          relationship: requires

    tags: [deadman, atomicity, tier-1, load-bearing, ssh-control-channel]
