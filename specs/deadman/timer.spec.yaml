spec:
    id: deadman-timer
    version: 0.2.0
    status: draft
    tier: 1

    context:
        system: kensa
        feature: deadman-timer
        description: |
            The deadman timer is the architectural answer to the hardest
            problem in the agentless SSH design: what happens when the
            connection Kensa is using is the thing Kensa is changing? The
            timer uploads a rollback script to the target host and
            schedules it via `at` or `systemd-run`; if the control channel
            survives apply+validate, the timer is cancelled, otherwise the
            scheduled script fires out-of-band and restores pre-state.
            Without this subsystem, the atomicity commitment in
            TRANSACTION_CONTRACT_V1.md §2.2 is not honorable for changes
            that affect SSH, networking, firewall, or PAM.
        related_specs:
            - engine-transaction
            - handler-interface

    objective:
        summary: |
            Provide out-of-band rollback for control-channel-affecting
            transactions. Arm a scheduled rollback script before apply,
            cancel on success, allow to fire on failure.
        scope:
            includes:
                - Pre-flight detection of scheduler availability (at or systemd-run)
                - Rollback script generation from captured PreStates (POSIX sh)
                - Script upload to /tmp/kensa-rollback-<txn-id>.sh
                - Schedule via at or systemd-run with configurable window
                - Cancel path via atrm / systemctl stop transient unit
                - Post-cancel verification of script removal
                - Keep-alive extension for long-running applies
            excludes:
                - Handlers and their capture/apply/rollback logic (delegated)
                - In-band rollback (handled by the engine directly)
                - Pre-state capture (handler responsibility)

    constraints:
        - id: C-01
          description: |
              The scheduler subsystem MUST detect availability of at OR
              systemd-run BEFORE apply runs. If neither is available, the
              engine MUST refuse to execute control-channel-sensitive
              rules and return ErrSchedulerUnavailable.
          type: security
          enforcement: error
        - id: C-02
          description: |
              The rollback script MUST be self-contained POSIX shell. It
              MUST NOT depend on bash-specific syntax, Python, or any
              runtime beyond what the minimal at/systemd-run environment
              provides.
          type: technical
          enforcement: error
        - id: C-03
          description: |
              The scheduled timer window MUST be at least 120 seconds by
              default. Shorter windows risk firing during normal apply;
              longer windows risk leaving the system broken for longer
              if apply hangs.
          type: security
          enforcement: error
        - id: C-04
          description: |
              On successful validate, the engine MUST cancel the timer
              AND verify cancellation by checking that the scheduled
              job no longer appears in atq / systemctl list-timers.
              Silent cancel failure is not acceptable.
          type: security
          enforcement: error
        - id: C-05
          description: |
              The rollback script MUST self-delete after execution (rm -f
              "$0") OR after successful cancel (engine removes the script
              file). Residual /tmp/kensa-rollback-*.sh files are a
              hygiene failure, not atomicity failure, but are still
              reported to the operator.
          type: technical
          enforcement: error
        - id: C-07
          description: |
              The at(1) time spec MUST be one at(1) can parse, and MUST NOT
              deliver a window shorter than the one requested.

              at(1) has no sub-minute unit: `at now + 120 seconds` is a parse
              error ("Garbled time", exit 1) on every implementation. Kensa
              emitted exactly that from its first release, so on any host
              carrying at(1) the deadman could not be armed, and because
              arming precedes apply the engine refused to proceed. The failure
              is fail-safe (the host is untouched) but it makes
              control-channel-sensitive remediations unusable on those hosts
              in direct-SSH mode. It went unnoticed because agent mode arms
              through an RPC that never reaches this code, and because at(1)
              is absent from a default minimal install.

              at(1) also truncates its base time to the whole minute before
              adding the offset, so `now + N minutes` delivers ((N-1)*60,
              N*60], always shorter than N minutes. Measured on RHEL 9: a
              2-minute spec submitted at :03, :10 and :17 past the minute
              scheduled 117, 110 and 103 seconds out.

              A naive ceil(window/60) therefore reads as rounding up and
              behaves as rounding down: the 120-second default would deliver
              61 to 120 seconds, and a deadman that fires mid-apply reverts a
              transaction still legitimately in flight. The spec MUST require
              ceil((window+60)/60), the smallest count whose lower bound
              (N-1)*60 is at least the requested window. This does not relax
              C-03: the delivered window is always at least the requested one.

              Fixtures for this path MUST model at(1)'s time-spec parsing. The
              fake that guarded it returned a job line for ANY spec, so it
              agreed with the code and the spec while all three disagreed with
              every real host.
          type: security
          enforcement: error

        # Constraint C-06 (keep-alive Extend()) deferred alongside
        # AC-07 — see "Deferred ACs" block below. Will be
        # re-introduced when the keep-alive feature lands.

        - id: C-08
          description: |
              An arm MUST NOT be reported as successful when the scheduler
              accepted the job but cannot run it.

              at(1) writes to a spool; atd(8) executes what is in it. They are
              separate and either can be present without the other. With atd
              stopped, at exits ZERO, prints a normal "job N at <time>" line,
              and queues the job; atq then lists it, because atq reads the
              spool as well. Every signal a caller checks says armed while
              nothing will fire. Verified on RHEL 9.7.

              The arm is what the engine treats as permission to apply, so
              reporting success here mutates a host behind a timer that cannot
              fire. That is worse than the parse failure it replaced, which at
              least aborted loudly with the host untouched. It is reachable on
              an ordinary machine: the RHEL `at` package enables atd without
              starting it, so a freshly installed host is in this state until
              it reboots.

              The at path MUST therefore check at(1)'s exit status AND its own
              diagnostic, and MUST remove the queued job when it refuses, so
              starting atd later cannot fire a rollback for a transaction that
              was never armed.

              Detection reads at(1)'s diagnostic rather than probing
              `systemctl is-active atd`, because the at path exists to serve
              hosts where systemd-run is unavailable, which includes hosts
              with no systemd at all. It also does not depend on the unit
              being named atd rather than at. The limitation is that an
              implementation which queued silently without warning would still
              pass; this narrows the window rather than closing it.
          type: security
          enforcement: error

        - id: C-09
          description: |
              The arm MUST be refused when the transaction's capturable steps
              produce NO rollback commands, and both arm paths MUST share the
              check so neither can acquire it without the other.

              The engine treats a successful arm as permission to apply, so an
              empty rollback script does not merely fail to help: it converts a
              loud fail-safe abort into a silent apply that the transaction log
              records as protected. Refusing costs an unremediated rule;
              proceeding costs a mutated host behind a rollback that restores
              nothing.

              The trigger is live, not hypothetical. `systemctl show -p
              UnitFileState -p ActiveState --value` emits ActiveState FIRST,
              and the service handlers parse those two lines positionally, so
              every captured value lands in the wrong field. Driving the real
              service_disabled rollback with the values systemd actually
              returns yields ZERO commands, where the values it expects yield
              `systemctl enable --now`. Its siblings degrade less loudly:
              service_masked and service_enabled still emit part of their
              rollback and silently drop the rest, which this guard does NOT
              catch. It bounds the empty case only; the incomplete case is the
              capture fix's to close.

              An empty list with NOTHING capturable is a different state and
              MUST NOT fail the arm. There is nothing to roll back, which is
              the honest position for a mechanism the rule itself declares
              non-transactional -- command_exec is control-channel sensitive
              and non-capturable, so it lands here. Nothing is scheduled and no
              script is uploaded, but Cancel MUST still resolve cleanly,
              because the engine holds armed=true for any successful arm and
              reads a Cancel error as "the deadman will fire".

    acceptance_criteria:
        - id: AC-01
          description: |
              Pre-flight detection probes for at and systemd-run. At
              least one is available, the engine proceeds. Neither
              available, the engine returns ErrSchedulerUnavailable.
          references_constraints: [C-01]
          priority: critical
        - id: AC-02
          description: |
              Script generation produces POSIX shell that reverses every
              capturable step in the current transaction, in reverse
              order, using captured PreStates.
          references_constraints: [C-02]
          priority: critical
        - id: AC-03
          description: |
              Script is uploaded to /tmp/kensa-rollback-<txn-id>.sh with
              mode 0700. Upload failure (disk full, permissions) aborts
              the transaction before apply.
          references_constraints: [C-02]
          priority: critical
        - id: AC-04
          description: |
              Scheduled via `at now + <ceil((window+60)/60)> minutes` or
              `systemd-run --on-active=<window-seconds>`. Post-schedule
              verification confirms the job appears in atq or systemctl
              list-timers.

              This AC previously read `at now + 120 seconds`, a syntax at(1)
              cannot parse. The spec, the implementation and the test fixture
              all agreed on it, and none had been run against a real at(1).
              See C-07 for why the +60 is load-bearing.
          references_constraints: [C-03, C-07]
          priority: critical
        - id: AC-05
          description: |
              On successful validate, cancel removes the scheduled job
              and verifies removal. If verification shows the job still
              present, transaction is recorded as errored with an
              anomaly flag.
          references_constraints: [C-04]
          priority: critical
        - id: AC-08
          description: |
              Script cleanup removes /tmp/kensa-rollback-<txn-id>.sh on
              successful cancel. Residual files are detected by a
              post-cancel scan and reported to the operator without
              failing the transaction.
          references_constraints: [C-05]
          priority: medium
        - id: AC-09
          description: |
              CancelDeadman API (from api/deadman.go) executes an
              in-band rollback cleanly and cancels the scheduled
              script. Returns ErrNoActiveDeadman if no timer is armed.
          references_constraints: [C-04]
          priority: high

        - id: AC-12
          description: |
              The at(1) path emits whole minutes and never a spec that could
              fire before the requested window: for every window the emitted
              count N satisfies (N-1)*60 >= window, so the 120-second default
              emits 3 minutes, not 2. The command contains no "seconds" unit.

              The assertion is on the delivered lower bound rather than a
              literal command string, because the lower bound is the safety
              property. Locked by TestAtSchedulingNeverFiresEarly, with
              TestAtSchedulingUsesWholeMinutes anchoring the encoding, both
              against a fake that rejects the specs at(1) rejects.
          references_constraints: [C-07]
          priority: critical

        - id: AC-13
          description: |
              Arm refuses, and removes the queued job, when at(1) reports that
              it could not signal atd, and when at(1) exits non-zero, in both
              cases despite a parseable job ID being present in the output.
              Locked by TestAtArmRefusedWhenAtdIsNotRunning and
              TestAtArmRefusedWhenAtExitsNonZero, against a fake that
              reproduces at(1)'s real behaviour on an atd-stopped host: exit
              zero, a normal job line, and the warning, all at once.
          references_constraints: [C-08]
          priority: critical

        - id: AC-17
          description: |
              A capture that yields no rollback commands fails the arm with an
              error naming the cause, and the host is not applied to. A
              transaction with nothing capturable schedules nothing, uploads no
              script, and still cancels cleanly.

              Locked by TestArmRefusedWhenCaptureYieldsNoRollback and
              TestNothingCapturableArmsNothing. The first uses a handler whose
              Rollback SUCCEEDS while emitting nothing, which is what the
              transposed service_* capture does today -- not an error path.
          references_constraints: [C-09]
          priority: critical

    # Deferred ACs — moved out of strict-coverage scope; track in
    # backlog for future deliverables. The spec keeps the AC IDs
    # reserved so re-introduction (when implemented) preserves the
    # historical AC numbering.
    #
    #   - AC-06 (connection-loss-mid-apply integration test):
    #     Requires emulated SSH disconnect. Out of scope for unit
    #     tests; covered structurally by AC-02 script-content
    #     tests. Future deliverable: cmd/kensa-fuzz extension to
    #     simulate mid-apply SSH drop on a real host.
    #   - AC-07 (keep-alive Extend()):
    #     Feature not yet implemented in deadman.Armer. Tracked in
    #     SPECTER_FEATURE_REQUEST.md.
    #   - AC-10 (clock-skew detection):
    #     Feature not yet implemented in deadman.Armer. Tracked in
    #     SPECTER_FEATURE_REQUEST.md.

    depends_on:
        - spec_id: handler-interface
          relationship: requires

    tags: [deadman, atomicity, tier-1, load-bearing, ssh-control-channel]
