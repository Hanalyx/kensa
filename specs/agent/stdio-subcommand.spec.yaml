spec:
    id: agent-stdio-subcommand
    version: 0.1.0
    status: draft
    tier: 2

    context:
        system: kensa
        feature: agent-stdio-subcommand
        description: |
            LL Phase 1 deliverable L-008. Flips
            `kensa agent --stdio` from the v1.0
            exit-1-placeholder (cli-agent-placeholder
            spec, shipped 2026-05-10 at 23b19c5) into a
            live echo loop. This is the agent process's
            first real I/O code path; L-009..L-013 add
            the full protocol on top.

            **Scope.** L-008 ships:

            1. `internal/agent/framing.go` — 4-byte
               big-endian length-prefix framing
               (`Read(r io.Reader) ([]byte, error)` /
               `Write(w io.Writer, payload []byte)
               error`). Stub framing per L-007's
               implementation note; L-010 supersedes
               with the production contract (heartbeat
               channel discrimination, max-size policy
               negotiation, partial-read recovery).

            2. `internal/agent/echo.go` — `RunEcho(ctx,
               r, w, stderr)` reads frames, unmarshals
               as `wirev1.Request`, builds a
               `wirev1.Response` echoing the payload
               and correlation_id back, writes a frame.
               Exits cleanly on stdin EOF.

            3. `cmd/kensa/agent.go` — runStdio() flips
               from exit-1 placeholder to call
               `agent.RunEcho(ctx, os.Stdin, os.Stdout,
               os.Stderr)`. Exits 0 on EOF, 1 on
               protocol/framing error.

            **Why echo and not the full protocol?**
            The handler-invocation message schema
            (Apply/Capture/Rollback payloads) lands at
            L-009. L-008's echo behavior validates the
            framing + Request/Response round-trip
            independently — when L-009's schema
            changes break tests, the failure points at
            the schema, not the framing.

            **Stub framing replaced at L-010.** The
            4-byte big-endian length prefix is good
            enough for L-008's single-frame echo. L-010
            adds:
              - A frame-type discriminator byte so
                heartbeats can travel on the same
                channel as Request/Response.
              - Configurable max-size policy (the
                stub hard-codes 16 MiB).
              - Backpressure / partial-read recovery
                for slow consumers.
            L-010 supersedes this spec's C-02; until
            then, the stub framing is the production
            contract.

            **Supersedes cli-agent-placeholder C-02 /
            AC-02.** The placeholder spec's "kensa
            agent --stdio MUST exit 1 with planned-for-
            v1.1 message" no longer holds post-L-008.
            The placeholder spec stays in the corpus
            as a historical record of what v1.0
            shipped (C-01, C-03, C-04, C-05 — bare
            invocation, --help text, --bogus rejection,
            top-level help listing — are still
            authoritative).

    objective:
        summary: |
            Add internal/agent/framing.go (Read +
            Write, big-endian length prefix, 16 MiB
            cap). Add internal/agent/echo.go (RunEcho
            unmarshal-as-Request → mirror payload →
            send Response). Flip cmd/kensa/agent.go
            runStdio() from exit-1 placeholder to
            call agent.RunEcho. Tests cover framing
            edge cases + an end-to-end cli-process
            test that spawns kensa agent --stdio, writes
            a Request frame, reads the echoed Response.
        scope:
            includes:
                - "internal/agent/framing.go: Read, Write, MaxMessageBytes"
                - "internal/agent/framing_test.go: roundtrip, partial reads, EOF, oversize reject, empty payload"
                - "internal/agent/echo.go: RunEcho — read frame → unmarshal Request → build Response → write frame"
                - "internal/agent/echo_test.go: echo loop unit tests with bytes.Buffer for stdin/stdout"
                - "cmd/kensa/agent.go: runStdio dispatches to internal/agent.RunEcho"
                - "cmd/kensa/agent_test.go: end-to-end subprocess test (spawn kensa agent --stdio, pipe frame, read echo)"
                - "scripts/cli-smoke.sh: add scenarios for the live echo behavior"
            excludes:
                - "Handler-invocation payload schema (Apply/Capture/Rollback): L-009"
                - "Frame-type discriminator + heartbeat channel: L-010"
                - "AgentTransport adapter on the controller side: L-011"
                - "Version handshake call site: L-012 (this spec's RunEcho doesn't call ValidateSchemaVersion yet — the echo's job is framing, not protocol negotiation)"
                - "Binary push + SHA cache: L-013"

    constraints:
        - id: C-01
          description: |
              `kensa agent --stdio` MUST read framed
              messages from stdin and dispatch each
              response on stdout. Idle clean EOF exits 0.
              With outstanding recovery, exit follows
              C-08 through C-10; clean EOF alone does not
              authorize process exit. Framing/protocol
              errors remain exit 1 even if recovery
              succeeds. Exit 2 was the placeholder-spec's
              bare-invocation contract; the live --stdio
              path no longer uses exit 1 for "not ready."
          type: business
          enforcement: error
        - id: C-02
          description: |
              The stub framing format MUST be a 4-byte
              big-endian unsigned length prefix followed
              by N bytes of payload. The decoder reads
              the 4-byte length first, then reads exactly
              N bytes. L-010 will add a frame-type
              discriminator before the length, breaking
              wire compatibility — L-008's stub framing
              is INTERNAL and not promised across kensa
              versions. Document this in
              `internal/agent/framing.go`.
          type: business
          enforcement: error
        - id: C-03
          description: |
              The decoder MUST refuse to allocate a
              buffer larger than 16 MiB. A peer sending
              a length prefix of (e.g.) 4 GiB would
              otherwise force `make([]byte, 4 GB)` and
              exhaust agent memory. 16 MiB is L-010's
              planned max; the stub uses the same cap so
              L-008 → L-010 doesn't change the policy
              under-the-hood.
          type: business
          enforcement: error
        - id: C-04
          description: |
              The echo response MUST preserve the
              Request's correlation_id and copy the
              payload bytes verbatim into Response.payload.
              Response.schema_version MUST equal 1 (the
              wirev1 current value). Response.error MUST
              be nil for the echo path; framing errors
              are surfaced via the return value of
              RunEcho, not via in-band Response.error,
              because L-008's contract is "echo or
              terminate," not "respond with error
              envelope."
          type: business
          enforcement: error
        - id: C-05
          description: |
              The echo loop MUST handle partial reads
              from stdin: a single Read syscall may
              return fewer bytes than requested. Use
              `io.ReadFull` (or equivalent) for both the
              length prefix and the payload. A peer that
              writes a frame in two write() calls MUST
              still be echoed correctly. Critical
              because SSH connections fragment stdin
              writes nondeterministically.
          type: business
          enforcement: error
        - id: C-06
          description: |
              `RunEcho` MUST exit 0 (no error) when
              stdin returns io.EOF cleanly between
              frames. Returning EOF mid-frame (after
              reading the length prefix but before
              completing the payload read) MUST be an
              error — that's a corrupted/truncated
              message, not a clean shutdown.
          type: business
          enforcement: error
        - id: C-07
          description: |
              agent.Run MUST preserve its between-frame
              context checks and low-level EOF/error
              distinction. SIGTERM/SIGINT request CLI
              shutdown. With no admitted Capture,
              mutation or recovery obligation, the
              existing 500ms blocked-read forced-exit
              fallback remains. It MUST NOT bypass C-08
              recovery ownership or C-09 error status.
              Its final idle/admission check MUST be
              serialized with C-10 registration.
          type: business
          enforcement: error
        - id: C-08
          description: |
              At connection termination or handled
              shutdown, close admission and own admitted
              Apply/handler-Rollback operations and their
              mutating commands/processes, as well as every
              reserved, initializing, recovering,
              canceling and tearing-down Armer job.
              Request stop via each mutation's own context
              and confirm its handler and owned mutating
              work stopped/joined before recovery commands
              or idle exit. Cancellation requests, handler
              return and parent-shell exit alone do not
              prove quiescence. Unknown stop/overlap stays
              owned and unresolved, potentially indefinitely.
              All trigger paths and mutation admission share
              this ordering barrier; a later mutation MUST
              NOT overwrite recovery. Claim pending recovery
              once, then execute after quiescence; join
              recovery already running. Concurrent
              timer/signal/parent/shutdown triggers MUST
              share one execution owner. Do not use
              CancelDeadman to drain a lost connection.
              Completion requires command waits, watcher
              join and owned-resource teardown; an empty
              active map is insufficient. No new
              supervisor or overall abort timer is added.
          type: business
          enforcement: error
        - id: C-09
          description: |
              Keep each rollback command's 60s execution
              deadline. Waiting for execution ownership and
              predecessor quiescence does not consume it;
              start that budget when ready to attempt launch.
              Only successful process Start counts as begun
              execution. A canceled queued command that never
              launched is pending cancellation, not interrupted
              execution; prior errors remain sticky.
              Attempt the supplied sequence once in order,
              continuing after ordinary failures only when
              failed work and its owned mutating processes
              are confirmed stopped/joined. A timeout alone
              cannot authorize overlap with the next command.
              An accepted pre-shutdown cancellation is the
              exception: stop the remaining sequence and
              join cleanup; execution already begun means
              failed/aborted recovery. Launch, nonzero/signal exit,
              timeout, aborted recovery and teardown
              errors remain sticky. Unknown/unjoined work
              remains owned and unresolved, not successful
              exit. After all work joins, such failures
              produce exit 1. Clean EOF/handled shutdown
              permits exit 0 only with clean recovery and
              cancellation outcomes. An earlier protocol
              or I/O error stays exit 1 even if recovery
              succeeds. The 500ms fallback cannot erase
              errors or abandon recovery. Exit 0 alone is
              not proof of restored host state.
          type: business
          enforcement: error
        - id: C-10
          description: |
              Serialize shutdown with arm reservation
              and explicit cancellation. Pre-frontier arm
              reservations are included through allocation
              failure/cleanup or recovery; later arms are
              refused before reservation/allocation. A
              pre-frontier explicit cancellation keeps
              its existing operation and acknowledgment;
              stop remaining commands rather than following
              C-09 ordinary-failure continuation. Join its
              owned work/cleanup and retain an interrupted
              already-started rollback as failed/aborted.
              A post-frontier cancellation cannot suppress
              recovery or acknowledge cancellation success;
              if returnable, use the existing error envelope
              code shutting_down. Repeated cancellation
              and shutdown join the same job owner. Do not
              hold the state lock during execution/joins.
          type: business
          enforcement: error

        - id: C-11
          description: |
              Capture admission MUST be atomic against
              recovery and shutdown under the lifecycle
              state lock. An admitted Capture retains its
              existing natural-completion context and native
              command/helper wait ownership until handler,
              synchronous waits and cleanup have joined.
              Shutdown MUST NOT cancel Capture. Recovery
              claims immediately but MUST wait for that join;
              later Capture is refused while recovery owns
              execution and permanently after shutdown.
              Supported dispatcher paths MUST prevent any
              mutation/recovery child reaper from overlapping
              Capture's native waits. Never hold the state
              lock during execution or joins. Unconfirmed
              completion stays owned and unresolved, possibly
              indefinitely; the 500ms idle fallback cannot
              abandon it or declare a failed wait successful.
              Distinguish ordinary Capture errors from native
              wait/ownership uncertainty. Completion must carry
              that outcome; uncertainty stays sticky even when
              a handler suppresses the native error. Natural
              Capture context may carry wait accounting but
              MUST NOT be canceled or mutation-owned.
          type: business
          enforcement: error

    acceptance_criteria:
        - id: AC-01
          description: |
              Framing roundtrip: Write(buf, p) followed
              by Read(buf) returns p byte-for-byte for
              p in {empty, 1 byte, 1 KiB, 1 MiB,
              MaxMessageBytes-1}. Locked by
              TestFraming_Roundtrip.
          references_constraints: [C-02, C-03]
          priority: critical
        - id: AC-02
          description: |
              Decoder rejects a length prefix > 16 MiB
              with an error, BEFORE allocating the
              buffer. Locked by
              TestFraming_RejectsOversizedFrame.
          references_constraints: [C-03]
          priority: critical
        - id: AC-03
          description: |
              Decoder handles partial reads via
              io.ReadFull semantics: a Reader that
              returns the frame in 1-byte chunks reads
              correctly. Locked by
              TestFraming_PartialReads.
          references_constraints: [C-05]
          priority: critical
        - id: AC-04
          description: |
              Clean EOF between frames returns io.EOF
              from Read. EOF mid-frame (after length
              prefix read, before payload complete)
              returns io.ErrUnexpectedEOF. Locked by
              TestFraming_EOFSemantics.
          references_constraints: [C-06]
          priority: high
        - id: AC-05
          description: |
              RunEcho reads a frame, echoes the Request
              payload back as a Response with the same
              correlation_id, exits 0 on clean stdin
              close. Locked by TestRunEcho_HappyPath.
          references_constraints: [C-01, C-04]
          priority: critical
        - id: AC-06
          description: |
              RunEcho returns ctx.Err() when ctx is
              already cancelled at the next
              between-frames check. Locked by
              TestRunEcho_PreCancelledContext. (The
              mid-read preemption case is L-012's
              responsibility via the explicit
              shutdown-message type.)
          references_constraints: [C-07]
          priority: high
        - id: AC-07
          description: |
              End-to-end: spawn `kensa agent --stdio`
              as a subprocess, write a Request frame to
              its stdin, read back the Response frame
              from its stdout, verify correlation_id +
              payload echo, close stdin, observe exit 0.
              Locked by TestKensaAgent_StdioEndToEnd.
          references_constraints: [C-01, C-02, C-04, C-05, C-06]
          priority: critical
        - id: AC-08
          description: |
              cli-smoke includes the live `kensa agent
              --stdio` echo path. Run-time too short to
              measurably slow the gate (single frame
              roundtrip is sub-millisecond). Verified
              during the merge workflow.
          references_constraints: [C-01]
          priority: medium
        - id: AC-09
          description: |
              Actual candidate processes with pending and
              executing recovery survive EOF/parent death
              until admitted mutations stop and their
              complete rollback sequence and teardown settle.
              A delayed/uncertain admitted Apply or handler
              Rollback cannot write after restoration or
              permit idle exit. Multi-command captured-state
              comparisons detect premature process exit.
              A deterministic real Capture/native-child
              schedule proves its original caller retains
              Wait/status, recovery waits for Capture join,
              and later Capture is refused. A supported-path
              predecessor/mutation control detects missing
              Capture accounting. Direct helper calls with
              untracked children remain outside that proof.
          references_constraints: [C-01, C-07, C-08, C-09, C-11]
          priority: critical
        - id: AC-10
          description: |
              Deterministic reservation-initialization,
              cancellation and duplicate-trigger schedules
              on both sides of shutdown demonstrate one
              owner, no lost obligation and no late admission.
              Accepted pre-shutdown cancellation stops later
              commands and joins cleanup. Interrupted started
              recovery is failed/aborted, not clean cancel.
          references_constraints: [C-08, C-09, C-10]
          priority: critical
        - id: AC-11
          description: |
              Command failure/timeout and teardown failure
              cannot produce exit 0 or mask an earlier
              protocol/I/O error. Unjoined work is not
              abandoned by an overall or 500ms exit timer.
              Actual waits and child/state evidence detect
              false completion and skipped later commands.
              A timed-out command with surviving/unknown
              mutating work prevents any later command;
              ordinary continuation begins only after join.
          references_constraints: [C-07, C-08, C-09]
          priority: critical
        - id: AC-12
          description: |
              Existing idle EOF, between-frame context,
              truncated-frame and idle SIGTERM behavior
              remains covered. Recovery has no 500ms exit
              exemption while an obligation remains.
          references_constraints: [C-01, C-06, C-07, C-09]
          priority: high

    tags: [agent, stdio, framing, echo, ll-phase-1, l-008]
