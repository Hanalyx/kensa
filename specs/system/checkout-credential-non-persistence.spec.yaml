spec:
    id: system-checkout-credential-non-persistence
    version: 0.1.0
    status: approved
    tier: 1

    context:
        system: kensa
        feature: checkout-credential-non-persistence
        description: |
            actions/checkout authenticates with the job's token and, by
            default, leaves that credential behind in the working copy. Every
            later step in the same job can then read it, including third-party
            actions and any script the build runs. The token is read-only now,
            which bounds the damage, but a credential that outlives its use has
            no reason to be there.

            checkout does not write the header into .git/config. It writes a
            separate config file and pulls it in with includeIf.gitdir, and
            `git config --local` does not follow includes. A check scoped to
            --local therefore reports nothing whether or not the credential is
            present, and would pass for the wrong reason. The verification here
            reads the effective configuration for that reason.

    objective:
        summary: |
            No checkout leaves a Git credential in the working copy, and a
            runtime assertion after each one proves it rather than asserting
            the declaration.
        scope:
            includes:
                - persist-credentials on every checkout step
                - The shared assertion script and where it runs
                - The Git operations that must continue to work without a credential
            excludes:
                - Action pins, triggers, permissions, job conditions
                - Every checkout input other than persist-credentials
                - Repository settings

    constraints:
        - id: C-01
          description: |
              Every actions/checkout step MUST set persist-credentials: false.
          type: security
          enforcement: error
        - id: C-02
          description: |
              The verification mechanism MUST NOT emit a credential value.
              Configuration is read with --name-only, and a failure names only
              the offending key. This is a property of the assertion script
              alone. It is not a claim that the gate can detect every way some
              future step might print configuration.
          type: security
          enforcement: error
        - id: C-03
          description: |
              The assertion MUST read the effective Git configuration, so a
              credential provided through includeIf is seen. A check scoped to
              --local is a violation, because it cannot observe the mechanism
              checkout actually uses and would pass vacuously.
          type: security
          enforcement: error
        - id: C-04
          description: |
              The assertion MUST run immediately after every checkout step, so
              no step can read a credential before it is checked for.
          type: security
          enforcement: error
        - id: C-05
          description: |
              The gate enforces, per workflow: the set of workflow files, the
              number of checkout steps in each, the permissions block, that
              every checkout is pinned to a full SHA, that fetch-depth: 0
              appears on exactly the approved jobs, and that no checkout input
              other than persist-credentials and fetch-depth is present.

              It does not compare a workflow against its previous revision, so
              it cannot by itself prove that nothing else changed. Broader
              equivalence — triggers, job conditions, step bodies — was checked
              at review time by parsing both revisions and comparing everything
              but the checkout inputs and the added assertion steps. That is a
              review step, not a standing gate, and this constraint claims only
              what the gate checks.
          type: technical
          enforcement: error

    acceptance_criteria:
        - id: AC-01
          description: |
              Every checkout sets persist-credentials: false, each is followed
              immediately by the shared assertion, and the assertion detects a
              credential provided the way checkout provides one without ever
              printing its value.
          inputs:
              workflows:
                  - .github/workflows/ci.yml
                  - .github/workflows/release.yml
              checkout_steps:
                  total: 17
                  ci: 16
                  release: 1
              required_input:
                  persist-credentials: false
              preserved_inputs:
                  # Bound to the jobs that carry it, not to a bare total: a
                  # count alone would accept the input moving between jobs.
                  fetch_depth_zero_jobs:
                      .github/workflows/ci.yml: [comment-lint, doc-style, release-snapshot]
                      .github/workflows/release.yml: [release]
              workflow_permissions:
                  .github/workflows/ci.yml: {contents: read}
                  .github/workflows/release.yml: {contents: write}
              assertion:
                  script: scripts/assert-no-git-credentials.sh
                  placement: the step immediately after each checkout
                  count: 17
              git_operations_that_must_still_pass:
                  comment_lint_fetch: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
                  doc_style_fetch: git fetch origin main --depth=1
                  goreleaser_reads: git log, git rev-parse, git tag --list
              fake_marker_cases:
                  absent: a repository with no credential configured
                  present_via_includeif: a credentials config pulled in with includeIf.gitdir, as checkout does it
                  include_without_header: the include pointer left behind after the header is unset
              mutations:
                  omitted_flag: one checkout step with persist-credentials removed
                  flag_true: one checkout step with persist-credentials set to true
                  new_checkout: an added checkout step without the flag
                  missing_assertion: the assertion deleted after one checkout
                  moved_assertion: the assertion no longer immediately after its checkout
                  count_drift: a checkout step removed
                  marker_printed: an assertion that echoes the credential value
                  vacuous_local_check: an assertion scoped to git config --local
                  echoed_assertion: a run body that echoes the script instead of running it
                  tolerated_failure: the script invoked with a trailing or-true
                  fetch_depth_moved: fetch-depth 0 moved to a job the spec does not name
                  permissions_changed: a workflow permissions block altered
          expected_output:
              every_checkout:
                  persist-credentials: false
                  other_inputs: unchanged
              assertion_count: 17
              assertion_placement: immediately after each checkout
              assertion_run_body: a bare invocation of the script, nothing else
              fetch_depth_zero_jobs: exactly the jobs named in inputs
              workflow_permissions: exactly the values named in inputs
              fake_marker:
                  absent: exit 0
                  present_via_includeif: exit 1
                  include_without_header: exit 1
                  marker_in_output: never
              scope: effective configuration, never --local only
              unchanged:
                  - action pins
                  - triggers
                  - permissions
                  - job conditions
                  - job names
                  - all checkout inputs other than persist-credentials
              every_mutation: gate fails
              release_job_runtime_confirmation: deferred to the next real release
          references_constraints: [C-01, C-02, C-03, C-04, C-05]
          priority: critical
          approval_gate: true
          approval_date: "2026-09-12"
