spec:
    id: handler-mount-option-set
    version: 0.2.0
    status: draft
    tier: 1
    context:
        system: kensa
        feature: handler-mount-option-set
        description: |
            The mount_option_set handler adds a mount option to an
            /etc/fstab entry and remounts the filesystem at runtime.
        related_specs:
            - handler-interface
    objective:
        summary: |
            Add a mount option to a fstab entry and remount.
            Rollback restores the prior fstab line and remounts.
        scope:
            includes:
                - fstab edit via awk
                - mount -o remount
                - capture of prior fstab line
                - rollback restoring prior line and remounting
            excludes:
                - bind mounts
                - NFS/CIFS mounts
    constraints:
        - id: C-01
          description: Apply MUST be idempotent.
          type: technical
          enforcement: error
        - id: C-02
          description: |
              Capture MUST record a prior state complete enough to restore
              from, and MUST return ErrCaptureIncomplete when it cannot.

              A mount point WITH an fstab entry: record the full line.

              A mount point with NO fstab entry is still describable when the
              filesystem is mounted, and MUST be captured rather than refused.
              systemd mounts /dev/shm this way on every current Enterprise
              Linux and Ubuntu, so refusing made a standard hardening control
              permanently unremediable. Record that the entry was absent, plus
              the live source, filesystem type and mount options: the options
              are what tells Rollback which options it introduced and which
              were already there.

              A mount point that is neither in fstab nor mounted cannot be
              described at all, and there ErrCaptureIncomplete still applies.
          type: security
          enforcement: error
        - id: C-03
          description: |
              Rollback MUST restore the prior fstab line and remount.

              When the captured prior state was "no fstab entry", Rollback MUST
              NOT simply delete the line:

              1. It MUST remove only the options this transaction applied, and
                 remove the LINE only when nothing else remains on it. Sibling
                 rules share one entry — /dev/shm, /tmp, /home and /var/tmp each
                 have three — so whichever rule created the line would otherwise
                 destroy the others' work when rolled back.

              2. It MUST negate the applied option explicitly on the live mount.
                 `mount -o remount <dir>` rereads options from fstab only for a
                 mount point that APPEARS in fstab; once the line is removed
                 there is nothing to reread and the option stays applied, so a
                 rollback that only rewrites fstab reports success while leaving
                 the host changed.

              3. It MUST NOT negate an option the mount already carried at
                 capture, which this transaction did not introduce.
          type: security
          enforcement: error
        - id: C-04
          description: |
              After remounting, Rollback MUST read the live mount options
              back (findmnt) and verify the security toggle options
              (nodev/nosuid/noexec) match the restored fstab line. A
              divergence, or an unreadable mount table, MUST be reported as
              a verified-partial restore (Success=false, PartialRestore=true)
              with a remedy, never a silent success.
          type: security
          enforcement: error
    acceptance_criteria:
        - id: AC-01
          description: Apply adds the option to the fstab line and remounts.
          references_constraints: [C-01]
          priority: critical
        - id: AC-02
          description: Capture records the prior fstab line.
          references_constraints: [C-02]
          priority: critical
        - id: AC-03
          description: Rollback restores the prior line and remounts.
          references_constraints: [C-03]
          priority: critical
        - id: AC-04
          description: |
              Rollback reads the live mount options back and verifies the
              security toggles match the restored line; a lingering or
              missing option (or unreadable mount table) reports a
              verified-partial restore with a remedy.
          references_constraints: [C-04]
          priority: critical
        - id: AC-05
          description: |
              Apply on a mount point with no fstab entry creates one, built
              from the source and filesystem type the kernel reports rather
              than from a guess. A mount point that is not mounted either is a
              failed step, not a created entry.
          references_constraints: [C-01]
          priority: critical
        - id: AC-06
          description: |
              Capture on a mount point with no fstab entry records an absent
              prior state — capturable, with the live source, filesystem type
              and options — when the filesystem is mounted, and returns
              ErrCaptureIncomplete when it is not.
          references_constraints: [C-02]
          priority: critical
        - id: AC-07
          description: |
              Rollback of an absent prior state removes the created entry and
              negates the applied option on the live mount, and leaves an
              option the mount already carried untouched.
          references_constraints: [C-03]
          priority: critical
        - id: AC-08
          description: |
              Rollback of an absent prior state keeps the fstab entry, minus
              its own options, when a sibling transaction has since added
              options to the same line.
          references_constraints: [C-03]
          priority: critical
    depends_on:
        - spec_id: handler-interface
          relationship: requires
    tags: [handler, capturable, tier-1, mount, fstab]
