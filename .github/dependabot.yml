# Dependabot configuration — supply-chain governance per Track S S-012.
#
# Why this file exists at all: the repo previously had no Dependabot
# configuration. Track S supply-chain audit (2026-05-29) flagged this as
# a real gap — Go and GitHub Actions deps could drift indefinitely with
# no automated PR cadence. The companion gates (S-005 govulncheck,
# S-014 -mod=readonly, S-010+S-011 depguard allowlist) catch what
# Dependabot misses; Dependabot catches the routine "v1.2.3 → v1.2.4"
# floor most projects bleed on.

version: 2
updates:
  # Go modules — direct deps in go.mod. Grouped minor + patch
  # so a single PR carries each weekly batch instead of 10 PRs landing
  # at 09:00 Monday. Major-version bumps still get their own PR (those
  # need a human deciding whether the API change is acceptable + a
  # corresponding entry in the supply-chain spec's allowlist rationale
  # per Track S S-010).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — actions/checkout, actions/setup-go, actions/setup-python,
  # actions/upload-artifact, golangci/golangci-lint-action and
  # sigstore/cosign-installer.
  #
  # Every one of those is pinned to a full commit SHA with the release tag in
  # a same-line comment. Dependabot maintains that form: it bumps the SHA and
  # rewrites the comment, so the pins do not go stale.
  #
  # The trade-off is accepted deliberately. GitHub does not raise Dependabot
  # security alerts for actions pinned to a SHA, only for ones using semantic
  # versioning, so a published advisory against one of these actions will not
  # open an alert here. Version-update pull requests still arrive weekly, and
  # whoever bumps a pin reviews upstream advisories for that action at the
  # same time. A full SHA is the only immutable way to reference an action,
  # and the release job runs third-party actions beside the signing secrets,
  # so immutability is worth more here than the alert.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
