id: shell-timeout
title: Terminate idle interactive sessions after the configured period
description: >
  An idle interactive session must terminate after a period of inactivity. Either
  mechanism satisfies this: a positive TMOUT in the shell startup files, or
  StopIdleSessionSec in logind.conf. The accepted period is the
  shell_idle_timeout_seconds variable, so a site can declare its own policy
  instead of inheriting a benchmark constant.
rationale: >
  An unattended terminal left logged in is a standing grant of that user's
  privileges to anyone who walks up to it. Terminating the session closes that
  window without depending on the user to remember. The default of 600 seconds is
  the strictest value any mapped benchmark requires, so it satisfies all of them
  at once; a site with a shorter policy declares it and the check follows.
severity: medium
category: access-control
tags: [shell, session, timeout, security]

# One control, one rule. These are labels for the same desired state, not
# separate controls: CIS and DISA disagree only on the number, and that number is
# now the variable. Replaces the former shell-timeout-600 (RHEL, STIG 600) and
# shell-idle-timeout-tmout (Ubuntu, UBTU STIG), which existed because a framework
# reference has nowhere to record the bound it requires.
references:
  cis:
    rhel8:  { section: "5.4.3.2", level: "L1", type: "Automated" }
    rhel9:  { section: "5.4.3.2", level: "L1", type: "Automated" }
    rhel10: { section: "5.4.3.2", level: "L1", type: "Automated" }
  stig:
    rhel8:
      - { vuln_id: "V-257258", severity: "CAT II" }
      - { vuln_id: "V-279929", stig_id: "RHEL-08-020360", severity: "CAT II" }
    rhel9:
      - { vuln_id: "V-258068", stig_id: "RHEL-09-412035", severity: "CAT II" }
    rhel10:
      vuln_id: "V-281295"
      stig_id: "RHEL-10-700920"
      severity: "CAT II"
    ubuntu22:
      vuln_id: "V-260554"
      stig_id: "UBTU-22-412030"
      severity: "CAT II"
      cci: ["CCI-000366", "CCI-002361"]
    ubuntu24:
      vuln_id: "V-270680"
      stig_id: "UBTU-24-200060"
      severity: "CAT II"
      cci: ["CCI-002361"]
  nist_800_53: ["AC-11", "AC-12", "SC-10"]

# Replaces two rules that split this control by OS and by framework, which the
# corpus forbids: a duplicate-citation test fails when two rules cite the same
# framework control. shell-timeout-600 was the DISA 600s bound on RHEL and
# shell-idle-timeout-tmout was the Ubuntu STIG. Declared so an operator running a
# corpus that still carries them gets them skipped rather than double-reported.
supersedes: [shell-timeout-600, shell-idle-timeout-tmout]

platforms:
  - family: rhel
    min_version: 8
  - family: ubuntu
    min_version: 22

implementations:
  # One implementation, no capability gate. The mechanism does not differ by
  # distribution: both set TMOUT in shell startup files and both run
  # systemd-logind. Only the file layout differs, so the check reads the union of
  # both layouts rather than forking the rule.
  #
  # This check is shell rather than a declarative method because the rule is a
  # DISJUNCTION -- logind OR TMOUT satisfies it -- and `checks:` composes with
  # AND. There is no any_of. A declarative form would also need config_value to
  # read several paths and understand export/readonly/typeset prefixes. Worth
  # revisiting if those land.
  - default: true
    check:
      method: command
      run: |
        limit={{ shell_idle_timeout_seconds }}
        pass=0
        # logind StopIdleSessionSec. systemd-analyze resolves drop-ins, so this
        # sees the effective value rather than only /etc/systemd/logind.conf.
        idle_sec=$(systemd-analyze cat-config systemd/logind.conf 2>/dev/null |
          grep -E '^[[:space:]]*StopIdleSessionSec[[:space:]]*=' | tail -1 |
          sed 's/^[^=]*=[[:space:]]*//')
        if [ -n "$idle_sec" ] && [ "$idle_sec" != "infinity" ] &&
           [ "$idle_sec" -gt 0 ] 2>/dev/null && [ "$idle_sec" -le "$limit" ] 2>/dev/null; then
          pass=1
        fi
        # TMOUT, read the way a shell actually resolves it. Two things a naive
        # grep gets wrong. Files are walked in SOURCING order, because `grep -r`
        # returns readdir order, which is filesystem-dependent and not the order
        # /etc/profile sources its drop-ins. And a `readonly` assignment LOCKS the
        # value: every later assignment fails with an error, so the first readonly
        # wins while an unlocked value is overridden by the last one. Reading
        # either "first" or "last" unconditionally credits a timeout the session
        # never adopts. Covers the RHEL layout (/etc/bashrc) and the Debian one
        # (/etc/bash.bashrc).
        tmout_val=""; locked=0
        for f in /etc/profile $(ls -1 /etc/profile.d/*.sh 2>/dev/null | sort) \
                 /etc/bashrc /etc/bash.bashrc; do
          [ -r "$f" ] || continue
          while IFS= read -r line; do
            case "$line" in \#*|'') continue ;; esac
            case "$line" in *TMOUT=*) ;; *) continue ;; esac
            v=$(printf '%s\n' "$line" | grep -oE 'TMOUT=[0-9]+' | head -1 | cut -d= -f2)
            [ -n "$v" ] || continue
            [ "$locked" -eq 1 ] && continue
            tmout_val="$v"
            printf '%s\n' "$line" |
              grep -qE '(readonly|typeset[[:space:]]+-[a-zA-Z]*r|declare[[:space:]]+-[a-zA-Z]*r)' &&
              locked=1
          done < "$f"
        done
        if [ -n "$tmout_val" ] && [ "$tmout_val" -gt 0 ] 2>/dev/null &&
           [ "$tmout_val" -le "$limit" ] 2>/dev/null; then
          pass=1
        fi
        # A writable TMOUT is one command from being switched off: `TMOUT=0` and
        # `unset TMOUT` both succeed against a plain assignment and both fail
        # against a readonly one. DISA requires the locked form on RHEL
        # (`declare -xr TMOUT=600` in the RHEL 8, 9 and 10 STIG fix text) and does
        # NOT ask for it on Ubuntu, whose STIG fix text is a plain `TMOUT=`. So
        # the requirement is read from the platform rather than applied
        # everywhere, which would fail Ubuntu hosts their own benchmark passes.
        # This is not mechanism selection, which capabilities are for; the
        # mechanism is identical and only the required strictness differs.
        rhel_like=0
        if [ -r /etc/os-release ]; then
          . /etc/os-release 2>/dev/null
          case " ${ID:-} ${ID_LIKE:-} " in *" rhel "*|*" fedora "*|*" centos "*) rhel_like=1 ;; esac
        fi
        # readonly is also legitimately written on its own line, as
        # "TMOUT=600" followed by "readonly TMOUT". The walk above only sees the
        # assignment line, so check for the bare declaration too before calling a
        # host non-compliant.
        if [ "$locked" -eq 0 ] && [ -n "$tmout_val" ]; then
          if grep -rhqE '^[[:space:]]*(readonly|declare[[:space:]]+-[a-zA-Z]*r|typeset[[:space:]]+-[a-zA-Z]*r)[[:space:]]+TMOUT([[:space:]]|$)' \
             /etc/profile /etc/profile.d/ /etc/bashrc /etc/bash.bashrc 2>/dev/null; then
            locked=1
          fi
        fi
        if [ "$pass" -eq 1 ] && [ -n "$tmout_val" ] && [ "$rhel_like" -eq 1 ] && [ "$locked" -eq 0 ]; then
          echo "FAIL: TMOUT=$tmout_val is within ${limit}s but is not readonly, so any user can run"
          echo "      'TMOUT=0' or 'unset TMOUT' and remove it. Set it with 'declare -xr' or 'readonly'."
          exit 1
        fi
        if [ "$pass" -eq 1 ]; then
          echo "OK: idle timeout within ${limit}s (logind=${idle_sec:-unset}, TMOUT=${tmout_val:-unset}, readonly=${locked})"
          exit 0
        fi
        echo "FAIL: no idle timeout within ${limit}s (logind=${idle_sec:-unset}, TMOUT=${tmout_val:-unset})"
        exit 1
      expected_exit: 0
    # file_content, not manual: it captures the prior file state and can roll
    # back. A managed drop-in also survives package updates that rewrite
    # /etc/profile, which editing that file in place does not.
    remediation:
      mechanism: file_content
      path: "/etc/profile.d/kensa-tmout.sh"
      # `declare -xr` verbatim from the RHEL STIG fix text: exported and readonly
      # in one statement. The earlier three-line form set TMOUT and then locked it
      # on a separate line, which is valid shell but meant the rule could not see
      # its own remediation as readonly and failed the host it had just fixed.
      content: "declare -xr TMOUT={{ shell_idle_timeout_seconds }}\n"
      mode: "0644"
