id: authorized-service-accounts
title: Ensure only authorized system accounts can obtain access
description: >
  System accounts (UID below 1000) exist to run services, not to log in. Any
  system account holding a real login shell can obtain access to the host, so it
  must be one the site authorized. The authorized set is a statement about what
  this system runs, so it cannot be derived from the host: an operator declares
  it in the authorized_service_accounts variable, as account names, numeric UIDs,
  or a mix. Until it is declared the check reports that it cannot assess the host
  and names what to set.
rationale: >
  A service identity with a login shell is an account, whatever it was created
  for. It is also the quietest way onto a machine: nobody audits the shell field
  of an account named after a daemon, and package installs add system accounts
  without anyone deciding they should. Listing every system account would be no
  use, because a base install carries two dozen and a list nobody maintains stops
  being true within a year. Listing only the ones that can actually obtain access
  is short enough to stay accurate, and it is the set the control is about.
severity: medium
transactional: false
category: access-control
tags: [accounts, service-accounts, least-privilege, access-control]

references:
  nist_800_53: ["AC-2", "AC-3", "AC-6"]
  nist_800_171: ["3.1.1[e]"]

platforms:
  - family: rhel
    min_version: 8
  - family: ubuntu
    min_version: 22

implementations:
  - default: true
    check:
      method: set_compare
      # Only system accounts that can OBTAIN ACCESS, which is the half of the
      # objective a host can enforce. The shell is the signal rather than the
      # password field: an account with a locked password and /bin/bash can still
      # log in with a key. sync, shutdown and halt are excluded because they are
      # standard entries whose "shell" runs one command and exits, so they are not
      # a way onto the machine.
      observed_command: "awk -F: '$3 < 1000 && $7 !~ /(nologin|false|sync|shutdown|halt)$/ {print $1\":\"$3}' /etc/passwd"
      authorized: "{{ authorized_service_accounts }}"
      # A site may authorize an account by name or by UID; both name the same one.
      alias_separator: ":"
    remediation:
      mechanism: manual
      note: >
        For each account reported as not authorized, decide which side is wrong.
        If it does not need to log in, give it a non-login shell
        (usermod -s /sbin/nologin <name>), which is the fix in almost every case.
        If it genuinely needs one, add it to authorized_service_accounts so the
        declared set matches what this system runs. Kensa does not change the
        shell automatically: an account that legitimately runs a login shell is
        rare but real, and taking it away can stop the service the host exists
        for.
