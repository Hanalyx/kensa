spec:
    id: check-audit-rule-match
    version: 0.3.0
    status: draft
    tier: 1

    context:
        system: kensa
        feature: check-audit-rule-match
        description: |
            Two questions about audit rules, answered by two predicates. The
            audit_rule_set duplicate guard asks whether two rules.d lines
            build the same kernel rule on the host (kernel duplicate identity,
            check.AuditRuleIdentity): if they do, augenrules loads both at
            boot, the kernel answers "Rule exists", and the load aborts. The
            audit_rule_exists check asks whether a rule auditctl -l lists
            records every event a requirement asks for (compliance coverage,
            auditRuleCovers). The answers differ: a loaded rule under another
            key, or over more syscalls, covers a requirement and is not its
            duplicate.
        related_specs:
            - auditnl-rule-set

    objective:
        summary: |
            Identity is exact and fails closed: two lines are distinct only
            when some part provably differs, from a capture or from a value
            resolved on the host, and anything else is the same or
            unresolved, which the guard refuses. Coverage passes a loaded rule
            with the same filters whose syscalls contain the requirement's,
            and reports ambiguous evidence when a loaded line may cover the
            requirement and the listing cannot show it: a scan shows the rule
            as skipped, and remediate leaves the host unchanged.
        scope:
            includes:
                - check.AuditRuleIdentity and check.AuditLoadedIdentity (identity), auditRuleCovers (coverage)
                - the host facts both depend on (AuditTargetProbe, ReadAuditTarget)
                - the audit_rule_exists check and the audit_rule_set guard as callers
                - remediate's handling of an ambiguous pre-check (scan-compliance-outcome C-08)
            excludes:
                - rule order on the loaded list (C-11)
                - the audit_rule_set shell staged-rollback verdict, which still uses AuditLineMaybeLoaded (C-10)

    constraints:
        - id: C-01
          description: |
              The guard and the check use different predicates. The guard
              refuses a write when AuditRuleIdentity returns Same or
              Unresolved for a line it adds against a line already in rules.d.
              audit_rule_exists passes a line when auditRuleCovers finds a
              loaded line that covers it, under its own key or, without
              key_required, under any key. Neither keeps a private matcher.
          type: technical
          enforcement: error
        - id: C-02
          description: |
              Each line is read the way auditctl reads it. "-k k" and
              "-F key=k" are a key; keys stay in order. An argument written
              against its flag (-Farch=b64, -Sexecve, -pwa, -kname) is read as
              if separated. "exit,always" and "always,exit" are one action and
              list, and -A is read as -a. The sides of a -C comparison are
              ordered (euid!=uid and uid!=euid are one comparison). auid!=unset,
              auid!=-1 and auid!=4294967295 are one value. A source -w drops
              trailing slashes, as auditctl does; a -w in a listing keeps
              one, because only a dir= rule prints one. A watch with no -p
              has perm rwxa. Perm letters are a set. A watch is the
              always,exit rule over every syscall with a path or dir field
              and a perm field that auditctl builds for it.
          type: technical
          enforcement: error
        - id: C-03
          description: |
              Facts about the host come from one read-only probe: uname -m,
              auditctl -v, each uid or gid name through `getent -s files`
              only, each watched path's type (directory, other, symlink,
              missing), and each syscall name a rule names, through
              `ausyscall <arch> <name> --exact` for the arch auditctl uses
              (b64 and no arch are the machine's own, b32 its 32-bit arch). A
              name known only through a directory service may not resolve
              when auditctl runs at boot, so it is left unresolved. What b64
              and b32 name is a fact of the machine, so arch aliases resolve
              on x86_64 and aarch64 whatever the audit version, as do errno
              names, through the asm-generic table those machines share,
              aliases included (EWOULDBLOCK is EAGAIN). The perm-class table is
              trusted only on x86_64 with audit userspace 3.1.5 or 4.0.3, the
              versions captured. A probe that cannot run is an error for the
              check and a refusal for the guard. The probe reads the host at
              the time of the check; auditctl decides a -w's field type again
              when it loads the rule at boot.
          type: security
          enforcement: error
        - id: C-04
          description: |
              Identity returns Distinct only when a part provably differs.
              The classes are from captures on RHEL 10.2 (kernel 6.12,
              audit-4.0.3) and Rocky 9.8 (kernel 5.14, audit-3.1.5), which
              gave the same result for every pair (testdata/auditctl), or from
              the kernel's field comparison where no pair was captured: a
              different key list, including keys in another order and a key on
              one side only (captured); a different action or list (captured);
              a different syscall mask (captured for pair 20, where a rule
              with no -S, an arch, a path or dir field and a perm loads as the
              class list and -S all is another rule; and an explicit list with
              a perm filter loads as the list joined with the class list),
              compared as syscall numbers from ausyscall on the host on any
              audit version, or as names on the measured gate; b64 against b32
              on any machine; a filter on both sides with a different operator
              or value after resolution (field comparison); an auid, euid or
              exit filter on one side only (field comparison; auditctl passes
              these through), or an arch on one side only (captured: auditctl
              adds none); a path field against a dir field, from source or
              from the type stat gives a -w (captured); dir values that differ
              only by a trailing slash (captured); different perm sets (field
              comparison); and different paths when both are absolute and in
              clean form (field comparison).
          type: security
          enforcement: error
        - id: C-05
          description: |
              Anything else that could differ is Unresolved, never Distinct:
              a symlinked -w, a path not in clean form, a name that does not
              resolve, a non-canonical number (auditctl reads 01000 as octal),
              a numeric syscall, a syscall name ausyscall does not resolve
              when the comparison needs it off the measured gate, a field other
              than auid, euid or exit on one side only, and every part that
              needs the measured gate off it. Names are read as libaudit 3.1.2
              reads them, tested by building rules in memory: field, syscall,
              action, list, comparison and arch names without regard to case,
              loginuid as auid, and every number stored as a u32 (-13 and
              4294967283 are one value). Path and key values keep their case.
              Same needs every part resolved and equal. The kernel compares
              fields in order and the predicate compares them as a set, so two
              rules that differ only in field order are called Same, an
              over-refusal (captured: they load twice).
          type: security
          enforcement: error
        - id: C-06
          description: |
              The guard fails closed. It refuses when it cannot read the
              target drop-in, when the rules.d scan exits other than 0 or 1
              (grep's no-match), and when the host-facts probe fails. A host
              with no rules.d directory has no rule to collide with. The scan
              takes a flag written against its argument.
          type: security
          enforcement: error
        - id: C-07
          description: |
              Coverage: a loaded line covers a requirement line when the
              action and list are equal; every filter is on both sides with
              the same operator and value after resolution (a filter on one
              side only is a real difference in the loaded rule); the path or
              dir field, its type and the perm set are the same; and, for an
              always rule, the loaded syscall mask contains the requirement's
              (every syscall, for -S all; the captured class list, for no -S
              with an arch; the list itself, for an explicit list), while a
              never rule needs the same mask. A loaded rule with the same
              filters over more syscalls records every event the requirement
              asks for, so it covers it. Keys follow key_required.
          type: technical
          enforcement: error
        - id: C-08
          description: |
              When a loaded line may cover a requirement line and the listing
              cannot show it, the check returns check.ErrAmbiguousEvidence, an
              ErrNotAssessable. A scan reports it as skipped (status
              "skipped", Err nil). Remediate does not apply the remediation:
              it records the platform gate's skip seam with the host
              unchanged (scan-compliance-outcome C-08), so for these rules
              AlreadyCompliant is now false where it was true. Other
              not-assessable cases, such as an unreadable ruleset, keep their
              behavior. The main case is an arch-less watch: auditctl -l
              prints a path= rule and a dir= rule on one file or directory
              both as -w (captured: dir= on the regular file /etc/shadow
              lists as -w /etc/shadow), and they record different events. A
              dir= rule on a directory covers its subtree. A dir= rule on a
              regular file stops recording once the file is replaced by
              rename. Measured on RHEL 10.2 only, with SYSCALL records per
              operation for dir= and path=: write in place 1 and 1, chmod 1
              and 1, chown 1 and 1, replace by rename 1 and 1, write after the
              replace 0 and 1. The skip detail says this listing cannot tell a
              path= watch from a dir= rule, so coverage is not proven. On a
              host with every corpus audit line loaded, this moves 10 rules
              from pass to skipped, on RHEL 10.2 (66 rules with an
              audit_rule_exists check; 56 pass after) and on Rocky 9.8 (49
              rules; 39 pass after): audit-file-faillock, audit-file-lastlog,
              audit-file-opasswd, audit-file-passwd, audit-file-shadow,
              audit-logins, audit-mac-policy, audit-session, audit-sudo-log
              and audit-sudoers.
          type: technical
          enforcement: error
        - id: C-09
          description: |
              The perm-class lists come only from captured auditctl -l output
              on x86_64: audit-4.0.3 and audit-3.1.5 print the same set for
              every arch and perm value. They are auditctl's lists, not the
              kernel's perm classes, which hold more syscalls (for example
              chown32 and truncate64 for b32, from the kernel's class tables;
              not captured), so a requirement that says -S all is covered
              only by a rule over every syscall.
          type: technical
          enforcement: error
        - id: C-10
          description: |
              The audit_rule_set shell staged rollback still decides
              PartialRestore with AuditLineMaybeLoaded (the earlier canonical
              matcher joined with the field-subset matcher). It is outside
              this spec's two predicates and changes separately.
          type: technical
          enforcement: warning
        - id: C-11
          description: |
              Known limits. Rule order is not modeled: a never rule loaded
              ahead of a covering always rule suppresses its records, and a
              coverage PASS does not claim otherwise. auditctl -l prints a
              never path rule as an always watch, so over that listing it
              reads as the watch. The
              records measurement in C-08 is from RHEL 10.2 only. A symlinked
              -w stays unresolved: one link to a file was captured as one rule
              with path=, a link to a directory was not. arm64 is not
              measured; corpus rules that name b64 syscalls aarch64 lacks
              (chmod, chown, lchown, rename, rmdir, unlink) are Unresolved
              there and the guard refuses them.
          type: technical
          enforcement: warning

    acceptance_criteria:
        - id: AC-01
          description: A loaded never rule does not cover an always rule under another key or the same key, for a syscall rule and for a path rule; an always rule under the same key covers it.
          references_constraints: [C-07]
          priority: critical
        - id: AC-02
          description: On the own-key path, a loaded line narrowed by success=0, or by a -C comparison and euid filter, does not cover the broader rule, and a loaded line missing the rule's -C and euid does not either; equal filters cover it.
          references_constraints: [C-07]
          priority: critical
        - id: AC-03
          description: Reversed -C sides, auid unset printed as unset or written as 4294967295, list-before-action, -A, flags written against their arguments, watch perms in another order, a watch with no -p, and a watch written with a trailing slash each compare equal to their listed form.
          references_constraints: [C-02]
          priority: critical
        - id: AC-04
          description: = against !=, a gid comparison against a uid comparison, egid=0 against euid=0, and auid=0 against auid!=-1 do not cover each other.
          references_constraints: [C-04, C-07]
          priority: critical
        - id: AC-05
          description: A loaded rule under another key, or over more syscalls, covers the requirement and the guard lets the requirement be written beside it; a narrower rule does not cover it; the same rule and key covers it and the guard refuses.
          references_constraints: [C-01]
          priority: critical
        - id: AC-06
          description: AuditLineLoaded finds a staged rule in its auditctl -l form, including auid printed as unset, and does not take a never line with the same fields for it. The shell staged rollback reports PartialRestore for both loaded forms and, under the interim union, for the never line too; it reports a clean restore when only an unrelated rule is loaded.
          references_constraints: [C-10]
          priority: critical
        - id: AC-07
          description: Through the check, a watch or arch-less path rule against a -w listing is skipped with a detail that says coverage is not proven, never passed or failed; a b64 path rule against a watch, a watch against a b64 path rule, a path rule with an auid filter against a watch, and a watch on another path fail; a listed trailing slash shows a dir field. Against a listing that names the field (a -a line with -F dir= or -F path=), a dir requirement is covered by a dir field and not by a path field, and the reverse.
          references_constraints: [C-08]
          priority: critical
        - id: AC-08
          description: A loaded rule with fewer filters than the requirement does not cover it, though it records more; a loaded rule with the same filters over more syscalls covers an always requirement and does not cover a never requirement.
          references_constraints: [C-07]
          priority: critical
        - id: AC-09
          description: Every captured path= and dir= rule (audit-4.0.3 and audit-3.1.5, through auditctl and through netlink) compares with its listed line. Loaded by auditctl, the listing is never Distinct from the rule and never fails to cover it, and only a -w listing is ambiguous. Loaded by netlink, an arch class rule or an explicit list with perm is Distinct from what auditctl builds and is still covered. A never path rule is the C-11 limit.
          references_constraints: [C-02, C-09, C-11]
          priority: critical
        - id: AC-10
          description: Against the printed listing, a loaded line missing one syscall of the class, with a different perm, arch, path or action, does not cover an arch path rule, and the check detail names the missing syscall. A requirement that says -S all is not covered by the expanded list, and a rule with arch!= never takes the perm-class path.
          references_constraints: [C-07, C-09]
          priority: critical
        - id: AC-11
          description: For each arch and each pair of perm values, the guard calls a rules.d path rule written with no -S, or with the expanded list, a duplicate of a new one only when the perm is the same, and never calls the -S all form a duplicate.
          references_constraints: [C-04]
          priority: critical
        - id: AC-12
          description: For every captured kernel pair (both fixtures), a pair the kernel loaded once is Same (Unresolved only for the symlinked watch), a pair it loaded twice is Distinct apart from the two named over-refusals (field order, a non-canonical number), and a pair with a rule the host refused outright is never Distinct.
          references_constraints: [C-04, C-05]
          priority: critical
        - id: AC-13
          description: The review's counterexamples. euid=0 against euid=root under one key is Same. dir= against path= on one directory is Distinct, and a path field does not cover a dir requirement. No -S against -S all on an arch path rule is Distinct. A loaded list with execveat beyond the execute class, or chown32 beyond the b32 attribute class, covers the requirement and is Distinct from it.
          references_constraints: [C-04, C-07]
          priority: critical
        - id: AC-14
          description: A symlinked watch, a doubled slash, a dot segment, a relative path, a name not in files, syscall sets off the measured machine, a class list off the measured version, a non-canonical number, a success filter on one side and a numeric syscall each give Unresolved.
          references_constraints: [C-05]
          priority: critical
        - id: AC-15
          description: The probe asks for uname -m, auditctl -v, getent -s files for each safe name and the type of each watched path, and leaves an unsafe name out. Its output parses into the facts, dropping an unknown path kind and a non-canonical id. Only x86_64 with a captured version is measured, and the perm-class table and errno names are used only there. A probe that fails is a plain error for the check.
          references_constraints: [C-03]
          priority: critical
        - id: AC-16
          description: Through Apply, the guard refuses the same rule under the same key (a reversed comparison, auid!=unset, euid=root against euid=0) and lets a never rule, a narrowed rule under another key, a privileged-exec rule and the same rule under another key be written. The guard's fail-closed refusals are in auditnl-rule-set AC-09.
          references_constraints: [C-01, C-04, C-06]
          priority: critical
        - id: AC-18
          description: A watch requirement against a -w listing is ErrAmbiguousEvidence, and so ErrNotAssessable, with a detail that names replacement by rename and says coverage is not proven, and no agent claim; an unreadable ruleset is not assessable and not ambiguous; a requirement with no candidate line fails.
          references_constraints: [C-08]
          priority: critical
        - id: AC-19
          description: Off the measured audit versions, two syscall rules that differ only in -S are Distinct when ausyscall on the host resolves every name to numbers, and Unresolved when it does not resolve one; one mask in another order is Same. errno aliases are Same, and an errno name not in the table is Unresolved. b32 against b64 is Distinct on any machine, b64 against x86_64 is Same on x86_64 whatever the version, and Unresolved on another machine. The probe leaves an unsafe syscall name out.
          references_constraints: [C-03, C-04]
          priority: critical

        - id: AC-20
          description: Spellings libaudit builds into the same rule data are Same; field, syscall, action, list and comparison names in another case, loginuid for auid, -1 or 4294967295 for unset, -13 and 4294967283, -EACCES in lower case, uid=-2 and 4294967294, uid=4294967296 and 0, and a0=-1 and 4294967295. A key or a path in another case is not.
          references_constraints: [C-02]
          priority: critical

    tags: [check, audit, rollback, tier-1]
