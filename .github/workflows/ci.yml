name: CI

on:
  # A pull_request run is the merge gate: it runs the full suite and it is what
  # the branch ruleset's required checks are evaluated against.
  #
  # A push run happens after the squash merge. Measured over the last 100 runs,
  # 39 of 40 push runs re-tested a tree a pull_request run had ALREADY tested
  # byte for byte, because squashing an up-to-date branch reproduces the tree it
  # was tested with. Comparing commit SHAs hides this (the squash mints a new
  # one); comparing trees shows it. So the push run is now a small canary rather
  # than a second full suite. See the per-job `if:` conditions below.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Checks whose answer changes on a clock rather than on our diff. govulncheck
  # reads an advisory database that moves without us, and the release snapshot
  # only breaks when packaging config or dependencies change. Running either per
  # pull request asks a question more often than its answer can change, and it
  # turns an unrelated upstream advisory into a red build on a docs-only PR.
  schedule:
    - cron: '17 6 * * *'
  # Hand-start any run. Added after the 2026-08-06 Actions incident, during which
  # webhook delivery was throttled and no push or pull_request event created a
  # workflow run for hours. Without this there was no way to start CI at all.
  workflow_dispatch:

# Every job here only checks out the repository and runs builds, tests and
# linters. None calls the GitHub API, posts a comment or status, publishes a
# package, or pushes a ref, so read access to the contents is the whole need.
#
# Naming any scope sets every scope not named to none, so this one line also
# drops the sixteen write scopes the repository's permissive default would
# otherwise hand every job. Artifact upload is unaffected: it authenticates
# with the Actions runtime token rather than GITHUB_TOKEN.
#
# A job that later needs more must ask for it in its own permissions block,
# which is the point: the grant becomes visible in review.
permissions:
  contents: read

# One in-flight run per ref. Pushing three times to a pull request used to run
# three full suites to completion; now the older two are canceled as soon as
# they are superseded. Never cancel on main: those runs are the post-merge
# record, and a canceled one would leave a gap in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build discipline (deliverables L-001 and L-002):
#   CGO_ENABLED=0      ensures the binary talks directly to the kernel ABI
#                      rather than going through glibc, so the same binary
#                      runs on RHEL 8 (glibc 2.28) through RHEL 12 and on
#                      Alpine (musl), with no glibc compatibility floor.
#   GODEBUG=netdns=go  defense-in-depth runtime hint that selects the
#                      pure-Go DNS resolver. The compile-time guarantee
#                      comes from the `-tags netgo` build flag in the
#                      Makefile; this env var ensures any DNS lookups
#                      during go test / go run also go through the pure-Go
#                      path, keeping CI consistent with the shipped binary.
# Both inherited by all jobs and steps below.
env:
  CGO_ENABLED: '0'
  GODEBUG: 'netdns=go'
  # Read-only modules: every `go` invocation refuses to mutate go.mod
  # or go.sum. Catches CI steps that would silently `go get` a new dep
  # under the contributor's nose. Track S S-014.
  GOFLAGS: '-mod=readonly'
  # Specter pin per P-012. The release tarball URL is used by the
  # spec-sync + spec-coverage-strict jobs. v0.13 unified `sync` and
  # `coverage` to both honor settings.strictness (threshold), so `specter
  # sync` now requires ingested results unless run with --strictness
  # annotation. spec-sync therefore runs `specter sync --strictness
  # annotation` (results-free structural check); spec-coverage-strict
  # remains the outcome gate that ingests `go test -json` results.
  SPECTER_VERSION: 'v0.15.0'
  # SHA-256 of the linux/amd64 release archive for SPECTER_VERSION. Both
  # installer blocks verify the downloaded archive against this before any
  # extraction, so a mirror, a proxy or SPECTER_INSTALL_URL cannot substitute
  # different bytes. Update it in the same commit as SPECTER_VERSION; a stale
  # pair fails closed rather than installing something unverified.
  # Not a secret: a published release digest, which is meant to be public.
  SPECTER_SHA256: 'af4e7129158b1ab9de61ed1f4fceec26bfeca8b636cdcca0195f8f7c51faa0ac'  # pragma: allowlist secret
  # syft builds the SBOM in the release-snapshot job. Kept in lockstep with
  # SYFT_VERSION in .github/workflows/release.yml so the snapshot exercises the
  # same generator the release uses; scripts/install-syft.sh verifies both.
  SYFT_VERSION: 'v1.46.0'
  # SHA-256 of syft_1.46.0_linux_amd64.tar.gz, from the published checksums
  # file and confirmed by hashing the downloaded archive.
  # Not a secret: a published release digest, which is meant to be public.
  SYFT_SHA256: 'd654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca'  # pragma: allowlist secret

jobs:
  spec-sync:
    # Specter runs before Go build — specs are the source of truth.
    # Hanalyx publishes Specter release tarballs at
    # github.com/Hanalyx/specter/releases (pinned to v0.15.0 above);
    # the install step uses the tarball first, falling back to
    # go install only if the release URL is unreachable. This job is
    # REQUIRED (no continue-on-error) since the pinned install is
    # reliable per P-012's CI validation.
    name: Spec Sync
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install Specter
        id: install
        run: |
          set -eo pipefail

          # Priority 1: the pinned GoReleaser release archive.
          #
          # The download and the integrity check are separate steps on purpose.
          # Piping curl into tar extracts bytes that were never checked, and
          # folding the digest test into the same condition as the download
          # would send a MISMATCH into the go install fallback below — turning
          # a possible tampering signal into a silent change of provenance.
          # So: branch on availability first, verify inside the success branch,
          # and exit non-zero on mismatch without reaching the fallback.
          tarball_url="${SPECTER_INSTALL_URL:-https://github.com/Hanalyx/specter/releases/download/${SPECTER_VERSION}/specter_${SPECTER_VERSION#v}_linux_amd64.tar.gz}"
          echo "Trying release tarball: $tarball_url"
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="$tmp_dir/specter.tar.gz"

          if curl -fsSL -o "$archive" "$tarball_url"; then
            echo "Verifying archive against the pinned digest"
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            if [ "$actual" != "$SPECTER_SHA256" ]; then
              echo "::error::Specter archive digest mismatch. Expected ${SPECTER_SHA256}, got ${actual}. Refusing to extract, and NOT falling back to a source build: a mismatch here is a supply-chain signal, not a download problem."
              exit 1
            fi
            tar -xzf "$archive" -C "$tmp_dir"
            sudo mv "$tmp_dir/specter" /usr/local/bin/specter
            sudo chmod +x /usr/local/bin/specter
            installed=$(/usr/local/bin/specter --version)
            if [ "$installed" != "specter version ${SPECTER_VERSION#v}" ]; then
              echo "::error::Installed Specter at /usr/local/bin/specter reports '${installed}', expected 'specter version ${SPECTER_VERSION#v}'."
              exit 1
            fi
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "method=tarball" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The archive URL was unreachable. That is an availability problem,
          # not an integrity one, so the existing source fallback still applies.

          # Priority 2: go install fallback.
          #
          # A source build has to clear the same version bar as the archive.
          # A build that succeeds while producing some other version is a
          # contract violation rather than an availability problem, so it fails
          # here instead of falling through to the next module path: another
          # attempt would let the wrong version be masked by a later success.
          mkdir -p "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          for path in \
              github.com/Hanalyx/specter/cmd/specter@${SPECTER_VERSION} \
              github.com/Hanalyx/specter@${SPECTER_VERSION}; do
            echo "Trying: go install $path"
            if go install "$path" 2>/dev/null; then
              if [ ! -x "$HOME/go/bin/specter" ]; then
                echo "::error::go install $path reported success but left no executable at $HOME/go/bin/specter."
                exit 1
              fi
              installed=$("$HOME/go/bin/specter" --version)
              if [ "$installed" != "specter version ${SPECTER_VERSION#v}" ]; then
                echo "::error::Source-built Specter at $HOME/go/bin/specter reports '${installed}', expected 'specter version ${SPECTER_VERSION#v}'. Refusing to record a successful install."
                exit 1
              fi
              echo "installed=true" >> "$GITHUB_OUTPUT"
              echo "method=go-install" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::Specter ${SPECTER_VERSION} could not be installed via tarball OR go install. Check that the release exists at github.com/Hanalyx/specter/releases."
          exit 1
      - name: Verify the Specter on PATH
        run: |
          set -eo pipefail
          # Every later step invokes `specter` through PATH, so the contract is
          # asserted against what PATH actually resolves to. That is not
          # necessarily the install location: the two install methods land the
          # binary in different directories.
          resolved=$(command -v specter)
          echo "specter resolves to: $resolved"
          installed=$("$resolved" --version)
          if [ "$installed" != "specter version ${SPECTER_VERSION#v}" ]; then
            echo "::error::Specter on PATH ($resolved) reports '${installed}', expected 'specter version ${SPECTER_VERSION#v}'."
            exit 1
          fi
      - name: specter doctor
        run: specter doctor
      - name: specter sync
        # v0.13 `sync` honors strictness:threshold, which needs ingested
        # results; use annotation (structural) mode here. The outcome gate
        # is the separate spec-coverage-strict job. See SPECTER_VERSION note.
        run: specter sync --strictness annotation
      - name: specter check --strict
        run: specter check --strict
      - name: specter resolve --mermaid
        run: specter resolve --mermaid > spec-graph.mmd
      - name: Upload spec graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-graph
          path: spec-graph.mmd
          if-no-files-found: ignore

  spec-coverage-strict:
    # P-012 deliverable: enforce tier-threshold coverage as a CI gate.
    # Tier 1 (atomicity-critical) requires 100% AC coverage; Tier 2
    # (apply-path / agent / rule-store) requires 80%; Tier 3 (CLI /
    # output formatters) requires 50%. Per the
    # `settings.strictness: threshold` mode in specter.yaml.
    #
    # Runs after spec-sync (which validates spec structure) and unit
    # (which produces fresh test results). We re-run go test ./... here
    # because the spec-coverage gate needs JSON output, which the unit
    # job doesn't publish as an artifact today. The duplicate run is
    # ~30s; trade-off is simpler workflow plumbing vs sharing
    # go-test.json across jobs.
    name: Spec Coverage (strict)
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [spec-sync, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install Specter
        run: |
          set -eo pipefail
          # Same pinned version and digest as the spec-sync installer. This
          # block has no source fallback and keeps it that way: an unreachable
          # archive is already fatal here, and a digest mismatch must be too.
          tarball_url="${SPECTER_INSTALL_URL:-https://github.com/Hanalyx/specter/releases/download/${SPECTER_VERSION}/specter_${SPECTER_VERSION#v}_linux_amd64.tar.gz}"
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="$tmp_dir/specter.tar.gz"

          # A download failure exits here under set -e, as it does today.
          curl -fsSL -o "$archive" "$tarball_url"

          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          if [ "$actual" != "$SPECTER_SHA256" ]; then
            echo "::error::Specter archive digest mismatch. Expected ${SPECTER_SHA256}, got ${actual}. Refusing to extract."
            exit 1
          fi

          tar -xzf "$archive" -C "$tmp_dir"
          sudo mv "$tmp_dir/specter" /usr/local/bin/specter
          sudo chmod +x /usr/local/bin/specter
          installed=$(/usr/local/bin/specter --version)
          if [ "$installed" != "specter version ${SPECTER_VERSION#v}" ]; then
            echo "::error::Installed Specter at /usr/local/bin/specter reports '${installed}', expected 'specter version ${SPECTER_VERSION#v}'."
            exit 1
          fi
      - name: Verify the Specter on PATH
        run: |
          set -eo pipefail
          # Same reason as the spec-sync job: assert the executable the
          # remaining steps will actually run.
          resolved=$(command -v specter)
          echo "specter resolves to: $resolved"
          installed=$("$resolved" --version)
          if [ "$installed" != "specter version ${SPECTER_VERSION#v}" ]; then
            echo "::error::Specter on PATH ($resolved) reports '${installed}', expected 'specter version ${SPECTER_VERSION#v}'."
            exit 1
          fi
      # protoc + protoc-gen-go required for the wire-protocol tests
      # that exercise compiled pb.go (same shape as the unit job).
      - name: Install protoc
        run: |
          PROTOC_VERSION="25.3"
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install protoc-gen-go
        run: |
          # Install the version go.mod pins, not @latest. tools.go exists so
          # that everyone regenerating wire.pb.go produces byte-identical
          # output, and @latest silently opts CI out of that: the generated
          # header carries the plugin version, so an upstream release turns
          # proto-check red on an unrelated change.
          V=$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
          echo "protoc-gen-go pinned by go.mod: $V"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$V"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Build bin/kensa before running tests — some tests in
      # internal/agent/dispatcher/setup_test.go skip when
      # bin/kensa isn't present (they exercise a local-stub
      # OpenAgent path that exec's the real binary). Skipped tests
      # don't count toward coverage, so the agent-cli-env-var spec
      # drops below its Tier 2 80% threshold without this step.
      - name: Build kensa binary
        run: make build
      - name: Run spec-coverage-strict
        run: make spec-coverage-strict
      - name: Upload .specter-results.json on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specter-results
          path: .specter-results.json
          if-no-files-found: warn

  unit:
    # Independent of spec-sync during the Specter-install-TBD window.
    # Once Specter is installable in CI, restore `needs: spec-sync`.
    name: Unit Tests
    runs-on: ubuntu-latest
    # Canary: also runs on the post-merge push. Two pull requests that each
    # pass alone can still break main together, and squashing a STALE branch
    # produces a tree no pull_request run ever saw. These two are the cheapest
    # pair that catches that, so the push run keeps them and drops the rest.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # protoc + protoc-gen-go installed BEFORE `make test` so
      # TestCodegenSync (the L-007 wire-protocol codegen-drift gate)
      # actually runs instead of self-skipping. The test fails hard
      # under CI when protoc is missing — that's the belt; running
      # the install here is the suspenders.
      - name: Install protoc
        run: |
          PROTOC_VERSION="25.3"
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install protoc-gen-go
        run: |
          # Install the version go.mod pins, not @latest. tools.go exists so
          # that everyone regenerating wire.pb.go produces byte-identical
          # output, and @latest silently opts CI out of that: the generated
          # header carries the plugin version, so an upstream release turns
          # proto-check red on an unrelated change.
          V=$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
          echo "protoc-gen-go pinned by go.mod: $V"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$V"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify wire.pb.go in sync with wire.proto
        # Belt-and-suspenders for TestCodegenSync: even if a future
        # test refactor accidentally weakens the Go-side gate, the
        # Make target keeps wire-schema drift from landing silently.
        run: make proto-check
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        # GOTOOLCHAIN=local forces `goinstall` to build the linter with the
        # setup-go toolchain above (the go.mod `go` version) instead of letting
        # Go auto-switch DOWN to golangci-lint's own go.mod toolchain. Without
        # this, `go install golangci-lint@<ver>` builds the linter against an
        # older Go (e.g. go1.25), which then cannot typecheck this repo's newer
        # Go (go1.26) code. The degraded typecheck makes staticcheck lose its
        # `t.Fatal` noreturn knowledge and emit SA5011 nil-deref false positives
        # across the test suite. `local` stays in sync with go.mod automatically.
        env:
          GOTOOLCHAIN: local
        with:
          # golangci-lint v2 (config schema `version: "2"`). v2 natively
          # supports go1.26; v1.64.8 predated it and only worked via the
          # GOTOOLCHAIN pin above. Action v9 requires a v2 linter.
          version: v2.12.2
          # install-mode: goinstall builds the linter from source using
          # the runner's Go (pinned by go-version-file: go.mod above).
          # Required because our deps (modernc/sqlite) require a recent
          # Go and pre-built linter binaries shipped against an older
          # toolchain can't read the newer Go's export data.
          install-mode: goinstall
          # Read .golangci.yml from the repo root. Comment-style rules
          # (revive exported, godot, misspell, gocritic) enforce
          # Google's Go Style Guide on the api/ surface.
          args: --config=.golangci.yml --timeout=5m

  comment-lint:
    # Fails when a NEW Go // comment carries a planning label (Phase 3,
    # Option B, ...) — those point into plans a future reader can't resolve.
    # Lints only lines added vs origin/main, so legacy comments are
    # grandfathered. fetch-depth: 0 + the explicit fetch give the diff a
    # merge-base to work from. See CONTRIBUTING.md, "Comments".
    name: Comment lint (no planning labels in new comments)
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Ensure base ref is present
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: comment-lint (added lines vs origin/main)
        run: make comment-lint

  docs-consistency:
    # Keeps the front-door docs present, well-formed, and in sync with the
    # release version: required files exist, CHANGELOG keeps an ## Unreleased
    # section with ISO-dated version headings, VERSION matches the newest stamped
    # CHANGELOG entry, the README states the current version, and SECURITY.md is
    # linked from README + CONTRIBUTING. See scripts/docs_check.sh and
    # CONTRIBUTING.md.
    name: Docs consistency
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - name: docs-check
        run: make docs-check

  doc-style:
    # Enforces the Hanalyx documentation style rules: no em dashes, no emojis,
    # no AI-speak filler or hype, US English, and a reading grade gate. The full
    # list is at the top of scripts/check-doc-style.py. Scans only Markdown
    # changed against origin/main, so the pre-existing backlog does not block
    # unrelated work.
    # Fenced and inline code are exempt; a maintainer-cleared line may carry
    # <!-- doc-style: allow -->. Shared tool, owned by hanalyx-platform-agent.
    name: Doc style
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - name: doc-style selftest
        run: python3 scripts/check-doc-style.py --selftest
      - name: doc-style (changed files)
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          make docs-style
      # The website syncs docs/guide/ and CHANGELOG.md verbatim and re-runs this
      # same check on the result, so a finding in either blocks a site publish
      # even when the file was not touched by the current branch. Gate that
      # surface unconditionally rather than only on change.
      - name: doc-style (website-synced surface)
        run: make docs-style-sync

  pre-commit:
    # Mirror the pre-commit framework checks contributors run locally.
    # Default-stage hooks in .pre-commit-config.yaml are file hygiene
    # only (no Go toolchain). Manual-stage hooks (Go fmt/vet/lint,
    # Specter) are handled by the Lint and Spec Sync jobs above.
    name: Pre-commit hygiene
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit==3.7.1
      # This job is also the repo's secret scan. The detect-secrets hook in
      # .pre-commit-config.yaml is DEFAULT stage, so `run --all-files` runs
      # detect-secrets v1.5.0 against .secrets.baseline right here. A separate
      # "Secret scan (detect-secrets)" job used to run the same pinned version,
      # the same baseline and the same excludes a second time; it was removed
      # because it re-collected a fact this job already had. Enforcement did not
      # move: this job is a required check, and a local `pre-commit run
      # --all-files` runs the identical hook.
      - name: Run default-stage hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build-static-verify:
    # Deliverable L-003: proves the
    # CGO_ENABLED=0 + -tags netgo discipline (L-001 + L-002) is honored
    # on every CI run by building all three binaries and asserting each
    # one is statically linked. Fails the workflow immediately if a
    # transitive dependency reintroduces dynamic linking.
    name: Build & Static Linking Verify
    runs-on: ubuntu-latest
    # Canary: also runs on the post-merge push. Two pull requests that each
    # pass alone can still break main together, and squashing a STALE branch
    # produces a tree no pull_request run ever saw. These two are the cheapest
    # pair that catches that, so the push run keeps them and drops the rest.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build all binaries
        run: make build
      - name: Verify static linking via ldd
        run: |
          set -e
          ok=0
          fail=0
          for bin in bin/kensa bin/kensa-fuzz bin/kensa-validate; do
            # ldd exits non-zero on static binaries; capture both streams
            # and look for the canonical message. We also accept `file`
            # output as a secondary signal.
            ldd_out=$(ldd "$bin" 2>&1 || true)
            file_out=$(file "$bin")
            if echo "$ldd_out" | grep -q "not a dynamic executable" \
               || echo "$file_out" | grep -q "statically linked"; then
              echo "  OK $bin: statically linked"
              ok=$((ok+1))
            else
              echo "  FAIL $bin: dynamically linked, regression"
              echo "    ldd:  $ldd_out"
              echo "    file: $file_out"
              fail=$((fail+1))
            fi
          done
          echo ""
          echo "Result: $ok passed, $fail failed"
          if [ "$fail" -gt 0 ]; then
            echo "::error::At least one binary is dynamically linked. Likely causes: (1) a new go.mod dependency pulls cgo; (2) the Makefile build target lost CGO_ENABLED=0 or -tags netgo; (3) something built with raw 'go build' instead of 'make build'. The canonical build entrypoint is 'make build' — direct go build invocations bypass the discipline."
            exit 1
          fi

  build-portability-glibc228:
    # Deliverable L-004: proves the static
    # binary actually runs on a glibc 2.28 system (RHEL 8 vintage). This
    # is the supported "oldest glibc" floor; if the binary fails here, a
    # transitive dependency or build-flag regression has reintroduced
    # libc symbol dependencies that the L-001/L-002 discipline was
    # supposed to prevent.
    #
    # Note: uses `kensa version` (subcommand) rather than `kensa --version`
    # (flag) because the GNU/POSIX flag form is added in CLI Phase 1
    # (deliverable C-001). Functionally equivalent for portability
    # verification — both exercise the same startup path.
    name: Portability — glibc 2.28 (RHEL 8)
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: make build
      - name: Verify binary runs in rockylinux:8 (glibc 2.28)
        run: |
          set -e
          # Confirm the container's glibc version matches the target.
          glibc_version=$(docker run --rm rockylinux:8 \
            bash -c '/lib64/libc.so.6 | head -1')
          echo "Target container glibc: $glibc_version"
          if ! echo "$glibc_version" | grep -q "version 2.28"; then
            echo "::error::Expected glibc 2.28 in rockylinux:8 but got: $glibc_version"
            exit 1
          fi

          # Run the static binary inside the glibc 2.28 container.
          out=$(docker run --rm -v "$PWD/bin:/kensa-bin:ro" rockylinux:8 \
            /kensa-bin/kensa version 2>&1)
          echo "Output: $out"
          if echo "$out" | grep -q "kensa "; then
            echo "  OK kensa version succeeded on glibc 2.28"
          else
            echo "::error::Binary failed to run on glibc 2.28 — L-001/L-002 regression. Output: $out"
            exit 1
          fi

  cli-smoke:
    # Deliverable C-010: runs the
    # GNU/POSIX exit-code smoke test on every PR, catching regressions
    # in --help / --version / bad-flag / unknown-subcommand paths
    # before they reach operators. Fast (~5s) and network-free.
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build all binaries
        run: make build
      - name: Run cli-smoke.sh
        run: make cli-smoke

  build-portability-alpine:
    # Deliverable L-005: proves the static
    # binary runs on Alpine (musl libc), not just glibc-based distros.
    # Together with L-004 (glibc 2.28), this verifies kensa's binary
    # is libc-independent end-to-end — the "compile once, run anywhere
    # Linux" claim.
    #
    # Note: uses `kensa version` (subcommand) rather than `kensa --version`
    # (flag) because the GNU/POSIX flag form is added in CLI Phase 1
    # (deliverable C-001). Functionally equivalent for portability —
    # both exercise the same Go runtime startup path.
    name: Portability — Alpine (musl)
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: make build
      - name: Verify binary runs in alpine:3 (musl libc)
        run: |
          set -e
          out=$(docker run --rm -v "$PWD/bin:/kensa-bin:ro" alpine:3 \
            /kensa-bin/kensa version 2>&1)
          echo "Output: $out"
          if echo "$out" | grep -q "kensa "; then
            echo "  OK kensa version succeeded on Alpine (musl)"
          else
            echo "::error::Binary failed to run on Alpine musl — L-001/L-002 regression. The binary may have a glibc-specific symbol or the static-link discipline broke. Output: $out"
            exit 1
          fi

  release-snapshot:
    # Catches breakage in .goreleaser.yaml + the rules-corpus packaging
    # before tag time. Runs goreleaser in snapshot mode (no publish, no
    # sign) so it exercises the build matrix, archive layout, both nfpm
    # blocks (kensa amd64+arm64 rpm+deb, kensa-rules noarch rpm+deb)
    # and the checksum step. Skips: publish (no GitHub release),
    # sign (no cosign secrets available on PR runs). The release-time
    # workflow (.github/workflows/release.yml) re-runs without the
    # skips and adds GPG + cosign signing.
    name: Release snapshot (no publish, no sign)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # On a clock, not on our diff. See the `schedule` trigger above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # goreleaser needs full history for version templating
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install goreleaser
        # Pinned to the version that has `archives.formats`,
        # `archives.ids`, and `nfpms.ids` (the post-rename field names
        # this config uses). v2.5.1 was too old and `goreleaser check`
        # rejected them. Keep this in lockstep with the
        # GORELEASER_VERSION in .github/workflows/release.yml.
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.15.4
          goreleaser --version
      - name: Install syft
        # Shared with the release job through scripts/install-syft.sh, which
        # verifies the pinned digest before extraction and the reported
        # version before use. One script so the two cannot drift apart.
        #
        # Unprivileged on purpose: the archive is third-party, so nothing in
        # it is unpacked or executed as root. It lands in a directory under
        # RUNNER_TEMP that is added to PATH for the later goreleaser steps.
        run: |
          syft_dir="$RUNNER_TEMP/syft-bin"
          mkdir -p "$syft_dir"
          ./scripts/install-syft.sh "$syft_dir"
          echo "$syft_dir" >> "$GITHUB_PATH"
      - name: Prepare pinned artifact-verification inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/prepare_candidate_inputs.py --dest "$RUNNER_TEMP/candidate-inputs"
      - name: Test candidate verification helpers and independent vectors
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_candidate_*.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_verify_envelope_vectors.py' -v
          python3 -B scripts/verify-envelope-vectors.py internal/evidence/testdata/v1-vectors.json internal/evidence/testdata/v2-vectors.json internal/evidence/testdata/numeric-vectors.json
      - name: goreleaser check
        run: goreleaser check
      - name: goreleaser release --snapshot --skip=publish,sign
        run: GORELEASER_CURRENT_TAG="v$(cat VERSION)" goreleaser release --snapshot --clean --skip=publish,sign
      - name: Verify the snapshot output and bind retained bytes
        run: |
          python3 -B scripts/verify_candidate_artifacts.py \
            --source "$GITHUB_WORKSPACE" --dist "$GITHUB_WORKSPACE/dist" \
            --out "$RUNNER_TEMP/candidate-verification" \
            --inputs "$RUNNER_TEMP/candidate-inputs/inputs.json" \
            --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Retain tested unsigned snapshot and verification evidence
        id: candidate-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kensa-snapshot-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-verification/bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          archive: true
          overwrite: false
          include-hidden-files: false
      - name: Require retained artifact identity
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.candidate-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ARTIFACT_URL"
          echo "Candidate artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP SHA-256: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact URL: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  vulnerability-scan:
    # Track S S-005: govulncheck against the binary call graph. Blocks
    # merge on a CALLED vulnerability (uncalled stdlib/dep vulns are
    # reported as informational only by govulncheck and do not fail).
    # Invoked via `go run` so go.mod's toolchain directive controls
    # which Go version compiles + runs govulncheck — required because
    # govulncheck installed via `go install` on Go N can't typecheck
    # source written against Go N+1.
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    # On a clock, not on our diff. See the `schedule` trigger above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # GOFLAGS unset for this step so `go run` can populate the
        # module cache (the top-level `-mod=readonly` would reject any
        # cache hit that requires a new download). The actual analysis
        # runs against committed go.mod / go.sum unchanged.
        env:
          GOFLAGS: ''
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  module-drift-check:
    # Track S S-014: verify go.mod + go.sum match `go mod tidy` output.
    # Drift signals a missing indirect, a leftover require, or a
    # checksum the contributor didn't commit — all supply-chain
    # smells. Fails loudly with a one-line "run go mod tidy locally" fix.
    name: Module drift check (go mod tidy is a no-op)
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go mod tidy + diff
        env:
          GOFLAGS: ''  # tidy needs write access to go.mod / go.sum
        run: make mod-tidy-check

  catalog-drift:
    # Rebuild the compliance-benchmark control catalog (kensa-catalog, a dev
    # tool) from the vendored sources in catalog/sources/ plus the rule corpus,
    # then gate against catalog/baseline.json. Fails the build if a rule drops a
    # framework reference (coverage regression) or starts citing a control absent
    # from the current benchmark (new reference drift). The known existing drift
    # is baked into the baseline, so this is green until coverage changes — then
    # `make catalog-baseline` refreshes it as part of the change.
    name: Catalog drift gate
    runs-on: ubuntu-latest
    # Merge gate. Runs on a pull request, and by hand. Skipped on the
    # post-merge push, which would re-test an identical tree.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert no Git credential persisted
        run: ./scripts/assert-no-git-credentials.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: make catalog-check
        run: make catalog-check
