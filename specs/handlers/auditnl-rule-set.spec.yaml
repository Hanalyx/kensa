spec:
    id: auditnl-rule-set
    version: 0.5.0
    status: draft
    tier: 1

    context:
        system: kensa
        feature: auditnl-rule-set
        description: |
            The audit_rule_set handler loads audit rules into the running
            kernel via AUDIT netlink (AUDIT_ADD_RULE / AUDIT_LIST_RULES /
            AUDIT_DEL_RULE through github.com/elastic/go-libaudit) when
            running on the target host (agent mode), and writes the
            /etc/audit/rules.d drop-in atomically (fsatomic), instead of
            shelling out to augenrules. The go-libaudit rule parser
            (rule/flags.Parse) is the same grammar auditctl implements, so
            the handler does not reimplement it.

            The netlink model is ADDITIVE per-rule: it loads this rule's
            lines into the kernel's flat rule list (it does NOT replicate
            augenrules' whole-rules.d compile-dedup-order-load). To keep
            rollback safe, Capture records which of the rule's lines were
            NOT already loaded ("added_rules"), and Rollback deletes only
            those — never a rule another drop-in owns.

            AUDIT netlink needs CAP_AUDIT_CONTROL (root); when the socket
            cannot be opened — or the audit config is immutable — the
            handler falls back to the augenrules shell path, so a host
            without netlink access behaves exactly as before.
        related_specs:
            - handler-audit-rule-set
            - check-audit-rule-match
            - kernelio-sysctl

    objective:
        summary: |
            Provide the AUDIT netlink rule primitives (BuildRule + an
            AuditClient) and wire audit_rule_set's Apply/Capture/Rollback to
            use them in agent mode, preserving the augenrules shell
            fallback, the drop-in persistence, and a rollback that unloads
            only the rules this apply added.
        scope:
            includes:
                - auditnl.BuildRule (flags.Parse + rule.Build → wire format)
                - auditnl.RuleLines (split a rule body into loadable lines)
                - auditnl.AuditClient interface + Open (ErrAuditUnavailable on failure)
                - auditnl.AuditTransport capability (FileTransport + AuditClient())
                - audit_rule_set dual-path Apply/Capture/Rollback
                - auditnl.RuleText and auditnl.RulesText (render the loaded rules for the staged-rollback verdict)
                - the staged-rollback verdict and the committed shell verify on both paths (C-09, C-10)
            excludes:
                - reimplementing augenrules' whole-directory load semantics
                - the engine transaction-phase event emission (separate deliverable)
                - the shell path's behavior (handler-audit-rule-set)

    constraints:
        - id: C-01
          description: |
              BuildRule MUST parse one auditctl-syntax rule line via
              go-libaudit and return its kernel wire format; the same line
              MUST always yield the same bytes (the equality basis Capture
              uses against AUDIT_LIST_RULES). A malformed line MUST return
              an error, never a partial/zero rule.
          type: technical
          enforcement: error
        - id: C-02
          description: |
              audit_rule_set MUST select the netlink path iff the transport
              implements auditnl.AuditTransport AND AuditClient() opens; an
              ErrAuditUnavailable (no privilege / no netlink socket) MUST send
              the handler to the augenrules shell path. A malformed rule
              line on the netlink path is a Success:false StepResult (and
              nothing is loaded or persisted), not a returned error.
          type: technical
          enforcement: error
        - id: C-03
          description: |
              Capture MUST record added_rules = the rule lines NOT already
              loaded in the kernel (by wire-format equality). Rollback MUST
              unload ONLY added_rules — a rule that was already loaded at
              capture (owned by another drop-in) MUST survive rollback.
              AUDIT_DEL_RULE of an already-absent rule (ENOENT) is a no-op.
          type: security
          enforcement: error
        - id: C-04
          description: |
              The drop-in write MUST be atomic (fsatomic) on the netlink
              path. Rollback MUST restore the prior drop-in content when it
              existed at capture and remove it when it did not.
          type: technical
          enforcement: error
        - id: C-05
          description: |
              After unloading added_rules, Rollback MUST read the live rule
              list back (AUDIT_LIST_RULES) and confirm none of the added
              rules remain loaded. A rule still present (a kernel that
              accepted DeleteRule without removing it), or a read-back that
              fails, MUST be reported as a verified-partial restore
              (Success=false, PartialRestore=true), never a silent success.
          type: security
          enforcement: error
        - id: C-06
          description: |
              When the audit config is immutable (GetStatus reports enabled 2
              on the netlink path, or `auditctl -s` reports "enabled 2" on the
              shell path) the handler MUST NOT attempt a runtime rule load
              (the kernel would refuse it with EPERM until reboot). It MUST
              instead stage the persist layer (merge the rule into the drop-in)
              and return a Success:true StepResult with Staged:true, so the
              engine terminates the transaction StatusStaged rather than
              running the runtime re-check and rolling back. The staged change
              MUST remain byte-perfect reversible from captured pre-state.
          type: technical
          enforcement: error
        - id: C-07
          description: |
              Apply MUST NOT write a drop-in line that builds, on the host,
              the same kernel rule as a line already in some rules.d file, as
              check.AuditRuleIdentity defines it in check-audit-rule-match: at
              the next reboot augenrules would load both, the kernel would
              answer "Rule exists", and the load would abort, dropping
              immutability. The key is part of the kernel rule: the same rule
              under another key loads twice (captured on RHEL 10.2 and Rocky
              9.8) and is not a duplicate. A pair the predicate cannot show to
              be distinct is refused like a duplicate. The lines one apply adds
              are also compared with each other. The rules.d lines compared are
              the ones augenrules loads: each *.rules file at the top of
              /etc/audit/rules.d, through a symlink too. A re-apply of the
              rule's own drop-in is idempotent, not a conflict. On refusal
              Apply returns Success:false with a detail naming both lines and
              the reason, and leaves resolution to the operator.
          type: security
          enforcement: error
        - id: C-08
          description: |
              The duplicate check fails closed. When Apply cannot read the
              target drop-in, cannot read the rules.d files (the scan exits
              other than 0 or 1), or cannot read the host facts the
              comparison depends on, it refuses rather than write a line it
              cannot show is not a duplicate. A host with no rules.d
              directory has no rule to collide with, but only when
              /etc/audit can be searched; otherwise rules.d may exist unseen,
              and Apply refuses.
          type: security
          enforcement: error
        - id: C-09
          description: |
              A staged rollback never reports a clean restore unless the live
              state shows it. After the drop-in is restored, the host may have
              rebooted, so auditd may have loaded a staged rule or set the
              immutable flag from a staged -e 2, and neither can change until
              the next boot. At boot auditctl built the rule, not BuildRule, so
              the verdict does not compare wire bytes. It reads the loaded
              rules (RulesText on the netlink path, auditctl -l on the shell
              path) and compares each staged line by kernel identity
              (check-audit-rule-match C-10). A loaded line, or one that may be
              loaded, gives PartialRestore. So does each read that fails: a
              rule listing that cannot be read, an auditctl -l with a non-zero
              exit or no output, an exit-list rule that cannot be rendered, a
              rule on a staged line's list that cannot be rendered, and a
              host-facts probe that fails. A rule on another list that cannot
              be rendered is left out. On the netlink path a staged -e 2, when
              capture did not read the config as immutable, gives
              PartialRestore when the status reads enabled 2 or cannot be
              read, on both paths. Capture records audit_immutable_at_capture
              when it read the config as immutable. A pre-state without it is
              read as mutable, so the status is checked. Both paths stage a
              persist_only directive on any host and mark the pre-state
              immutable_staged and persist_only. A persist_only rollback
              removes the line and runs no load, since Apply ran none. A
              staged line that is neither a rule nor -e 2 (for example -b
              8192) gives PartialRestore, since no listing shows it. A listed
              line the parser cannot read, and a rule on an unknown filter
              list that cannot be rendered, count as possibly the rule. This
              keeps the staged semantics: the persist layer is restored now
              and the ruleset at the next boot. Only the false clean result is
              fixed.
          type: security
          enforcement: error
        - id: C-10
          description: |
              A committed shell rollback that does not read the config as
              immutable verifies the unload through auditctl -l with the same
              identity comparison, since augenrules --load removes a rule only
              when the compiled rules start with -D. A line Apply added that is
              loaded or may be loaded, a listing or fact read that fails, a
              control line other than -e 2, and an added -e 2 when auditctl -s
              could not be read each give PartialRestore. With no rule line
              added, there is nothing to verify and the restore is clean. This
              can report a partial restore of a clean host; it never reports a
              clean restore of a host that is not.
          type: security
          enforcement: error
        - id: C-11
          description: |
              A committed netlink rollback verifies the unload by kernel
              identity over RulesText, not by wire bytes. If the host rebooted
              after Apply, auditctl loaded the drop-in line at boot in its own
              form, which DeleteRule of the BuildRule wire misses with ENOENT.
              A rule Apply added that is still loaded, or may be, a line the
              listing cannot show, and a listing, render or fact read that
              fails each give PartialRestore. The rollback reports such a copy
              and deletes nothing beyond the BuildRule wire Apply loaded: a
              loaded copy may be an operator's rule.
        - id: C-13
          description: |
              The netlink listing keeps each field's operator: arch on any
              rule, and path, dir, key and perm in a watch, which
              go-libaudit's printer writes with "=" or none. A rule written
              arch!=, path!= or dir!= that is loaded gives PartialRestore on
              the staged and committed netlink paths. A rule line that also
              carries a control option (for example -b 8192), which auditctl
              acts on when it loads the line, gives PartialRestore like a
              control line.
          type: security
          enforcement: error
        - id: C-12
          description: |
              Capture always records persist_only. Rollback reads a pre-state
              without it as captured before the field existed. When such a
              pre-state's added lines hold a control line (-e 2, or any line
              that is not a rule), Rollback treats it as staged with no load:
              it never runs a bare augenrules --load, and the live status and
              the control-line check decide the verdict. A pre-state without
              audit_immutable_at_capture reads as mutable, so the status is
              read.
          type: security
          enforcement: error

    acceptance_criteria:
        - id: AC-01
          description: |
              BuildRule parses watch ("-w /etc/passwd -p wa -k identity")
              and syscall ("-a always,exit -F arch=b64 -S execve -k exec")
              rules to non-empty, deterministic wire format and rejects a
              malformed line; RuleLines drops blanks/comments.
          references_constraints: [C-01]
          priority: critical
        - id: AC-02
          description: |
              Netlink Apply loads the rule into the kernel and writes the
              drop-in; a malformed rule line yields a Success:false step
              with nothing loaded or persisted.
          references_constraints: [C-02]
          priority: critical
        - id: AC-03
          description: |
              Netlink Capture → Apply → Rollback unloads the rule it added
              and removes a drop-in that did not exist at capture.
          references_constraints: [C-03, C-04]
          priority: critical
        - id: AC-04
          description: |
              A rule already loaded at capture (owned by another drop-in)
              survives rollback — only added_rules are unloaded.
          references_constraints: [C-03]
          priority: critical
        - id: AC-05
          description: |
              The handler falls back to the augenrules shell path both when
              the transport lacks the audit capability and when AuditClient()
              returns ErrAuditUnavailable.
          references_constraints: [C-02]
          priority: critical
        - id: AC-06
          description: |
              Netlink Rollback reads the live rule list back and reports a
              verified-partial restore when a rule it added is still loaded
              after the unload attempt.
          references_constraints: [C-05]
          priority: critical
        - id: AC-07
          description: |
              On an immutable audit config (netlink GetStatus enabled 2, or
              shell `auditctl -s` enabled 2) Apply stages the drop-in and
              returns Success:true, Staged:true WITHOUT loading into the
              kernel (LoadedCount stays 0 on the netlink path); the staged
              change is byte-perfect reversible on rollback.
          references_constraints: [C-06]
          priority: critical
        - id: AC-08
          description: |
              A line already in another rules.d file as the same kernel rule
              under the same key (a watch against its path= rule, a syscall
              rule with its syscalls in another order and auid!=-1 for
              auid!=unset) is refused with Success:false and the drop-in is
              not written. The same line under another key is written. An
              absent rule, or a re-apply of the rule's own drop-in, proceeds.
          references_constraints: [C-07]
          priority: critical
        - id: AC-09
          description: |
              An unreadable rules.d (scan exit 2), a failed host-facts probe
              and an unreadable target drop-in each refuse without writing; a
              pair with a name the host does not resolve through files is
              refused with "cannot show"; an empty rules.d proceeds; a rules.d
              line with flags written against their arguments is compared and
              refused as the duplicate it is; two lines of one rule that build
              one kernel rule are refused with nothing on disk. The scan reads
              a symlinked *.rules file, and not a .bak or .conf file or a
              subdirectory; an unreadable *.rules file and an unsearchable
              /etc/audit make it exit non-zero.
          references_constraints: [C-08]
          priority: critical
        - id: AC-10
          description: |
              For every captured auditctl load of a syscall rule (audit-4.0.3
              and audit-3.1.5), a staged line whose boot wire is rebuilt from
              the captured auditctl -l line gives PartialRestore through the
              netlink staged rollback, with the drop-in removed. For at least
              one row that wire differs from BuildRule of the staged line.
          references_constraints: [C-09]
          priority: critical
        - id: AC-11
          description: |
              Netlink staged rollback gives PartialRestore when GetRules fails,
              when an exit-list rule cannot be rendered, when a rule on a staged
              line's list cannot be rendered, and when the probe fails; it finds
              a rule added with -A; it is clean with an unrenderable
              filesystem-list rule or an unrelated rule loaded. A persist_only
              -e 2 staged on a mutable host gives PartialRestore after a reboot
              into enabled 2 or with an unreadable status, and is clean with no
              reboot or when capture read enabled 2. Shell staged rollback gives
              PartialRestore when auditctl -l exits non-zero, fails in the
              transport, prints nothing, or the probe fails, and when the rule
              is loaded; "No rules" is clean. A staged -w whose path changed
              type since boot (loaded path= and a directory now, loaded dir=
              and missing or a file now) gives PartialRestore. RulesText fails
              on an exit-list rule it cannot render, prepend bit or not, and
              names the list it leaves another rule out of.
          references_constraints: [C-09]
          priority: critical
        - id: AC-12
          description: |
              A committed shell rollback with an unreadable auditctl -s gives
              PartialRestore when the added rule is still listed, when
              auditctl -l cannot be read, and when the added line is -e 2; it
              is clean when the listing lacks the rule. With a mutable status
              it gives PartialRestore when the rule is still listed or a
              listed line cannot be read, and is clean when the rule is gone.
          references_constraints: [C-10]
          priority: critical
        - id: AC-13
          description: |
              For every captured row whose boot wire differs from BuildRule of
              its line, a rule committed on a mutable host and reloaded at boot
              in auditctl's form gives PartialRestore through the netlink
              committed rollback.
          references_constraints: [C-11]
          priority: critical
        - id: AC-14
          description: |
              A shell persist_only capture is marked staged and persist_only.
              Its rollback runs no augenrules, is clean with no reboot, and
              gives PartialRestore after a reboot into enabled 2 or with an
              unreadable status. A -b 8192 line gives PartialRestore on the
              shell staged and committed paths.
          references_constraints: [C-09, C-10]
          priority: critical
        - id: AC-15
          description: |
              Pre-states captured at 2a07253, after a JSON round trip, roll
              back with no bare augenrules --load for a persist_only or staged
              line and no load at all for a persist_only line. A persist_only
              -e 2 from a mutable host is clean with enabled 1 and partial with
              enabled 2 or an unreadable status; one from an immutable host is
              partial. Rule pre-states are clean when the listing lacks the
              rule and partial when it shows it.
          references_constraints: [C-12]
          priority: critical
        - id: AC-16
          description: |
              Rules written arch!=, path!= and dir!= give PartialRestore when
              loaded at boot after a staged netlink apply, and when still
              loaded after a committed netlink rollback. A shell staged rule
              line with -b 8192 after the rule gives PartialRestore naming it.
          references_constraints: [C-13]
          priority: critical

    tags: [handler, auditnl, audit, netlink, agent, tier-1, phase-5]
