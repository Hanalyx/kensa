spec:
    id: recovery-replay
    version: 0.1.0
    status: draft
    tier: 1

    context:
        system: kensa
        feature: crash-recovery-replay
        description: |
            Recovery replay compensates transactions interrupted before they
            reached a terminal status. The engine's Recover scans the store's
            open journal entries (recovery-journal spec) — a prepared
            transaction with no terminal record — reconnects to the host, rolls
            each one back from its captured pre-state, and records a terminal
            StatusRecovered result (StatusRollbackFailed if the compensation
            could not be machine-clean). It reuses the finalize path, so a
            recovered transaction is recaptured, signed, persisted, and its
            journal entry cleared, exactly like a live terminal outcome.

            Recovery is idempotent: restore-from-pre-state is itself
            re-runnable, and clearing the journal on a durable terminal record
            means a second Recover finds nothing. Recovery is scoped by host;
            the caller (kensa recover) is responsible for fencing Recover
            against a live engine on the same store (the recover.lock).
        related_specs:
            - recovery-journal
            - engine-transaction

    objective:
        summary: |
            Compensate interrupted transactions by rolling each back from its
            captured pre-state and recording a durable StatusRecovered outcome,
            idempotently and scoped by host.
        scope:
            includes:
                - Scan open journal entries and compensate each
                - Pre-state-driven rollback (no live apply results)
                - Terminal StatusRecovered / StatusRollbackFailed record + journal clear
                - Host scoping; idempotent re-run
                - The recover.lock cross-process fencing primitive
                - Step-identity validation before dispatch, and refusal reporting (including kensa recover output and exit status)
            excludes:
                - The kensa recover CLI argument parsing (cli spec)
                - On-host kill-9 cross-process durability test (destructive; validated out-of-band)

    constraints:
        - id: C-01
          description: |
              Recover MUST process every open journal entry for the requested
              host, and each one ends in exactly one of two ways. If its step
              identity is established (C-05), Recover rolls it back from its
              captured pre-state in reverse step order, then records a terminal
              result — StatusRecovered when the compensation is machine-clean,
              StatusRollbackFailed otherwise — and clears the journal entry once
              that record is durable. If its identity cannot be established, or
              its pre-states cannot be read, Recover refuses it: nothing is
              dispatched, no terminal record is written, the journal entry and
              pre-states are left intact, and the refusal is reported with every
              finding. Until this amendment C-01 required a terminal record for
              every entry, although the unreadable-pre-state path already left
              the entry open.
          type: security
          enforcement: error
        - id: C-02
          description: |
              Recover MUST be idempotent: after a successful recovery the
              transaction has a terminal record, so a second Recover does not
              process it again; and pre-state-driven rollback is safe to run
              even on a step whose mutation never actually committed.
          type: security
          enforcement: error
        - id: C-03
          description: |
              Recover MUST scope to the requested host (empty host = all open
              entries), so a recovery run for one host never compensates a
              transaction targeting another.
          type: technical
          enforcement: error
        - id: C-04
          description: |
              A recovery run MUST take an exclusive cross-process advisory lock
              (the recover.lock, flock) before compensating, so two recovery
              runs cannot race and a recovery run cannot act while a live
              engine holds the lock. The acquisition is non-blocking and fails
              fast when the lock is held; the lock is released automatically if
              the holding process dies.
          type: security
          enforcement: error

        - id: C-05
          description: |
              Before dispatching any restoration for an entry, Recover MUST
              establish that the journal's intent and the loaded pre-states
              agree one to one: each step index appears exactly once on each
              side; every pre-state matches an intent step and every intent
              step has a pre-state; each pre-state's mechanism equals its
              intent step's; every mechanism is registered in the running
              binary's own registry (never an assumption made for agent mode);
              and each pre-state's capturable flag equals its handler's. Any
              failure refuses the whole entry, including its steps that pass
              on their own, because steps can depend on each other and a
              partial restoration can leave a combination the host was never
              in. A refusal MUST NOT be recorded as a rollback result, and an
              unknown mechanism MUST NOT panic. Atomic persistence of the
              journal proves all-or-nothing writing, not that the writer was
              correct or that the registry matches it, so a disagreement is
              refused rather than explained. Keeping a refused entry's evidence
              preserves the opportunity to recover it later; it does not
              guarantee recovery, since a missing or ambiguous pre-state cannot
              be rebuilt.
          type: security
          enforcement: error
    acceptance_criteria:
        - id: AC-01
          description: |
              Given an open journal entry (prepared, never finalized) with
              captured pre-state, Recover rolls the step back from pre-state,
              records a StatusRecovered terminal result, and clears the journal
              entry (no open entry remains).
          references_constraints: [C-01]
          priority: critical
        - id: AC-02
          description: |
              After a successful recovery, a second Recover call returns no
              results for that transaction (idempotent — the terminal record
              removed it from the open set).
          references_constraints: [C-02]
          priority: critical
        - id: AC-03
          description: |
              Recover with a hostID only processes open entries for that host;
              entries for other hosts are left untouched (still open).
          references_constraints: [C-03]
          priority: high
        - id: AC-04
          description: |
              The recover lock fences: while one exclusive holder is active, a
              second exclusive (or shared) acquisition fails fast with
              ErrRecoverLocked; after release the lock is re-acquirable, and
              two shared holders may coexist.
          references_constraints: [C-04]
          priority: critical
        - id: AC-05
          description: |
              The live-engine side of the fence: an engine constructed
              WithRecoverLock holds the recover lock SHARED for the duration of
              a mutation. Run and RollbackTransaction return api.ErrRecoverActive
              (transient) when a recover holds the exclusive lock, and proceed
              once it is released — so a recovery cannot compensate a
              transaction the engine is mid-flight on.
          references_constraints: [C-04]
          priority: critical
        - id: AC-06
          description: |
              An entry whose identity is established is recovered exactly as
              before the identity check existed: each capturable step's
              handler is invoked once, in reverse step order, with that step's
              own pre-state, and the verdict and journal clearing are
              unchanged. A capturable handler that cannot roll back still
              yields a failure row and StatusRollbackFailed; that is a
              reversal failure, not an identity refusal.
          references_constraints: [C-01, C-05]
          priority: critical
        - id: AC-07
          description: |
              An entry with a duplicate intent index, a duplicate pre-state
              index, an unmatched or missing pre-state, a mechanism mismatch,
              an unknown mechanism (capturable or a non-capturable marker), or
              a capturability disagreement is refused: no handler is invoked
              for any of its steps, recovery does not panic, no terminal record
              is written, its journal entry stays open, and no result claims it
              was recovered. A valid non-capturable marker is not dispatched.
              Other entries in the same run are still recovered, and re-running
              recovery refuses the same entry again without dispatching.
          references_constraints: [C-01, C-05]
          priority: critical
        - id: AC-08
          description: |
              Recover reports each refused entry with every finding that
              applies to it (code, step index, mechanism, detail), including an
              unreadable pre-state bundle. Facts about a single record, whether
              its mechanism is registered and whether a pre-state's capturable
              flag matches its handler, are reported even when the record
              cannot be paired; a pre-state is compared with an intent step only
              where each index is unique on both sides. Each fact is reported
              once, ordered by step index, then finding code, then mechanism.
              No finding appears as a rollback result. A caller of Recover receives the compensated results
              together with a RecoveryRefusedError when any entry was refused.
          references_constraints: [C-01, C-05]
          priority: critical
        - id: AC-09
          description: |
              kensa recover lists compensated entries as before, lists each
              refused entry and its findings on stderr with guidance to check
              the host for later changes before retrying, never reports a
              refused entry as "no interrupted transactions found", and exits
              1 when any entry was refused while still reporting the entries
              it compensated.
          references_constraints: [C-01]
          priority: high

    depends_on:
        - spec_id: recovery-journal
          relationship: requires

    tags: [engine, recovery, atomicity, tier-1]
