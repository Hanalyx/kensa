id: security-updates-installed
title: Ensure updates, patches, and additional security software are installed
description: >
  Available vendor updates and security patches should be applied. This
  rule flags when the package manager reports pending updates.
rationale: >
  Unapplied updates leave known vulnerabilities exploitable. Keeping the
  system current is a primary defense against publicly known CVEs.
severity: medium
transactional: false
category: system
tags: [patching, updates, vulnerability-management]

references:
  cis:
    rhel9:  { section: "1.2.2.1", level: "L1", type: "Manual" }
    rhel8:  { section: "1.2.2.1", level: "L1", type: "Manual" }
    rhel10: { section: "1.2.2.1", level: "L1", type: "Manual" }
  stig:
    rhel9: { vuln_id: "V-257778", stig_id: "RHEL-09-211015", severity: "CAT II" }
    rhel8:
      vuln_id: "V-230222"
      stig_id: "RHEL-08-010010"
      severity: "CAT II"
  nist_800_53: ["SI-2"]

platforms:
  - family: rhel
    min_version: 8

implementations:
  - default: true
    check:
      method: command
      run: |
        # Capture the exit code DIRECTLY. The previous version wrapped this in
        # `if dnf check-update; then ... fi` and then read $? afterwards, which
        # is always 0: a shell `if` whose condition fails and which has no else
        # returns success. So rc was never 100, the pending-updates branch was
        # unreachable, and a host with 384 pending packages reported OK.
        dnf -q check-update >/dev/null 2>&1
        rc=$?
        case "$rc" in
          0)
            echo "OK: no pending package updates"
            exit 0
            ;;
          100)
            n=$(dnf -q check-update 2>/dev/null | grep -cE '^[a-zA-Z0-9]')
            echo "FAIL: ${n:-some} package update(s) pending; system flaws are not corrected"
            exit 1
            ;;
          *)
            # dnf could not answer: no network, a broken repo, no metadata. That
            # is not evidence the host is patched, and reporting OK here is how
            # the old version hid a real finding. Fail loudly with the code.
            echo "FAIL: dnf check-update could not complete (exit $rc), so pending updates are unknown"
            exit 1
            ;;
        esac
      expected_exit: 0
    remediation:
      mechanism: manual
      note: >
        Review pending updates with `dnf check-update` and apply approved
        updates with `dnf update` on your change-controlled schedule.
